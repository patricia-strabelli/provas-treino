<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3ª Prova Treino · 9º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F3; --card:#FFFFFF; --ink:#20242B; --muted:#6A7078;
    --line:#E4E2DC; --good:#1E8449; --good-bg:#E7F4EC; --bad:#C0392B; --bad-bg:#FBEAE8;
    --accent:#2471A3;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;line-height:1.55;font-size:17px}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 64px}
  code,.mono{font-family:"Space Mono",monospace}

  header.top{padding:30px 0 18px;border-bottom:2px solid var(--ink)}
  .kicker{font-family:"Space Mono",monospace;font-size:12.5px;letter-spacing:.14em;color:var(--muted);margin:0 0 8px}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.02;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:8px 0 0;font-size:15.5px}

  .scorebar{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;margin-top:2px;border-bottom:1px solid var(--line)}
  .scores{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
  .scores .item{display:flex;gap:7px;align-items:baseline}
  .scores .num{font-family:"Space Mono",monospace;font-weight:700;font-size:21px;color:var(--ink)}
  .scores .lab{font-size:12.5px;color:var(--muted)}
  .scores .hit .num{color:var(--good)}
  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}

  nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--muted);
    font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14.5px;
    padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.15s}
  .tab .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
  .tab .cnt{font-family:"Space Mono",monospace;font-size:11.5px;color:var(--muted)}
  .tab:hover{border-color:var(--c)}
  .tab.active{color:#fff;background:var(--c);border-color:var(--c)}
  .tab.active .cnt{color:rgba(255,255,255,.85)}
  .tab.active .dot{background:#fff}
  .tab.done::after{content:"\2713";font-family:"Public Sans";font-weight:700;margin-left:2px}

  .mathead{display:flex;align-items:center;gap:10px;margin:26px 0 4px}
  .mathead h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;margin:0;color:var(--accent)}
  .mathead .bar{height:3px;flex:1;background:var(--accent);opacity:.25;border-radius:2px}

  .q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
     border-radius:14px;padding:18px 18px 16px;margin:14px 0}
  .q .meta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .q .qn{font-family:"Space Mono",monospace;font-weight:700;font-size:13px;color:#fff;background:var(--accent);
     border-radius:7px;padding:2px 8px}
  .pill{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);
     border-radius:99px;padding:2px 8px;background:#fbfaf8}
  .pill.yr{color:var(--accent);border-color:var(--accent)}
  .q .stem{font-size:16.5px;margin:2px 0 14px}
  .q .stem em{color:var(--ink)}
  .fig{margin:12px 0;overflow-x:auto;color:var(--accent)}
  .fig svg{max-width:100%;height:auto;display:block}
  table.nut{border-collapse:collapse;font-family:"Space Mono",monospace;font-size:14px;min-width:230px;background:#fff}
  table.nut td{border:1px solid var(--line);padding:5px 12px}
  table.nut td:last-child{text-align:right;font-weight:700}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
     border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px 13px;cursor:pointer;
     font:inherit;color:var(--ink);transition:.12s}
  .opt:hover:not(:disabled){border-color:var(--accent);background:#fbfcfd}
  .opt:disabled{cursor:default}
  .opt .letter{font-family:"Space Mono",monospace;font-weight:700;font-size:14px;color:var(--muted);
     border:1.5px solid var(--line);border-radius:7px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .opt .txt{padding-top:1px}
  .opt.correct{border-color:var(--good);background:var(--good-bg)}
  .opt.correct .letter{background:var(--good);border-color:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.correct .mark,.opt.wrong .mark{margin-left:auto;font-weight:700;align-self:center}
  .opt.correct .mark{color:var(--good)} .opt.wrong .mark{color:var(--bad)}

  .exp{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px;display:none}
  .exp.show{display:block}
  .exp.ok{background:var(--good-bg);color:#15613a}
  .exp.no{background:var(--bad-bg);color:#8f2419}
  .exp b{font-weight:700}

  .summary{display:none;background:var(--accent);color:#fff;border-radius:16px;padding:22px;margin:20px 0 6px}
  .summary.show{display:block}
  .summary h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;margin:0 0 6px}
  .summary .big{font-family:"Space Mono",monospace;font-weight:700;font-size:40px;line-height:1;margin:6px 0}
  .summary p{margin:6px 0 0;opacity:.92;font-size:15px}
  .summary .next{margin-top:16px;background:#fff;color:var(--accent);border:none;border-radius:10px;
     font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;padding:11px 18px;cursor:pointer}

  footer.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .restart{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;
     font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14.5px;padding:10px 18px;cursor:pointer}
  .restart:hover{background:var(--ink);color:#fff}
  .foot .note{font-size:12.5px;color:var(--muted)}
  @media (max-width:520px){ body{font-size:16px} .q{padding:15px 14px} }
</style>
</head>
