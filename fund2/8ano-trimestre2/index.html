<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2ª Prova Treino — 8º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f2;
    --surface:#ffffff;
    --ink:#1c1b1a;
    --ink-soft:#565250;
    --line:#e6e3dd;
    --line-strong:#d7d3cb;
    --ok:#1b8a4b;
    --ok-bg:#e7f6ec;
    --ok-line:#7fce9c;
    --no:#c9314a;
    --no-bg:#fcecef;
    --no-line:#f0a5b2;
    --accent:#0d9488; /* trocado por matéria via JS */
    --accent-soft:#0d94881a;
    --radius:16px;
    --shadow:0 1px 2px rgba(28,27,26,.05), 0 8px 24px rgba(28,27,26,.05);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:17px;
    line-height:1.55;
  }
  .mono{font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
  h1,h2,h3,.display{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;}

  /* ---------- Cabeçalho ---------- */
  header{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:26px 20px 18px;
  }
  .head-inner{max-width:820px;margin:0 auto}
  .eyebrow{
    font-family:"Space Mono",monospace;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 6px;
  }
  h1{
    margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.02;
    font-size:clamp(30px,7vw,46px);
  }
  .sub{margin:6px 0 0;color:var(--ink-soft);font-size:16px}
  .mode-note{
    margin:14px 0 0;font-size:14px;color:var(--ink-soft);
    display:flex;align-items:center;gap:8px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:0 0 auto;box-shadow:0 0 0 4px var(--ok-bg)}

  /* ---------- Barra de status ---------- */
  .statusbar{
    position:sticky;top:0;z-index:20;
    background:rgba(246,245,242,.86);
    backdrop-filter:saturate(150%) blur(8px);
    -webkit-backdrop-filter:saturate(150%) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .status-inner{
    max-width:820px;margin:0 auto;padding:12px 20px 14px;
    display:flex;flex-direction:column;gap:10px;
  }
  .stats{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .stat{display:flex;align-items:baseline;gap:7px}
  .stat b{font-family:"Space Mono",monospace;font-size:19px;font-weight:700}
  .stat span{font-size:13px;color:var(--ink-soft);letter-spacing:.01em}
  .stat.acertos b{color:var(--ok)}
  .btn-reset{
    margin-left:auto;border:1px solid var(--line-strong);background:var(--surface);
    color:var(--ink);border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:.15s;
  }
  .btn-reset:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
  .progress i{
    display:block;height:100%;width:0;border-radius:999px;
    background:var(--accent);transition:width .35s ease;
  }

  /* ---------- Abas ---------- */
  .tabs-wrap{background:var(--surface);border-bottom:1px solid var(--line);}
  .tabs{
    max-width:820px;margin:0 auto;padding:10px 12px;
    display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;border:1px solid var(--line-strong);background:var(--surface);
    color:var(--ink-soft);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;
    display:flex;align-items:center;gap:8px;
  }
  .tab .tdot{width:9px;height:9px;border-radius:50%;background:var(--tab);flex:0 0 auto}
  .tab .tcount{font-family:"Space Mono",monospace;font-size:11px;color:var(--ink-soft);
    background:var(--line);border-radius:999px;padding:1px 7px;}
  .tab[aria-selected="true"]{
    color:#fff;background:var(--tab);border-color:var(--tab);
  }
  .tab[aria-selected="true"] .tdot{background:#fff}
  .tab[aria-selected="true"] .tcount{background:rgba(255,255,255,.22);color:#fff}

  /* ---------- Conteúdo ---------- */
  main{max-width:820px;margin:0 auto;padding:26px 20px 90px}
  .subject-head{margin:0 0 20px}
  .subject-head h2{
    margin:0;font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.015em;
    display:flex;align-items:center;gap:11px;
  }
  .subject-head .bar{width:26px;height:26px;border-radius:8px;background:var(--accent);flex:0 0 auto}
  .subject-head p{margin:6px 0 0;color:var(--ink-soft);font-size:14.5px}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 20px;margin:0 0 18px;box-shadow:var(--shadow);
  }
  .card-top{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
  .qnum{
    font-family:"Space Mono",monospace;font-weight:700;font-size:15px;
    color:#fff;background:var(--accent);border-radius:9px;
    min-width:38px;height:32px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;
  }
  .skill{
    font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.04em;
    color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);
    border-radius:999px;padding:3px 10px;
  }
  .context{
    background:#faf9f6;border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15.5px;color:#2c2a28;
  }
  .context .ctag{
    display:block;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;
  }
  .context p{margin:0 0 9px}
  .context p:last-child{margin-bottom:0}
  .context em{font-style:italic}
  .context .speaker{color:var(--ink-soft)}
  .statement{margin:0 0 15px;font-size:17px;font-weight:500}
  .statement q{font-style:italic}

  .options{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);
    border-radius:12px;padding:13px 15px;font:inherit;font-size:16px;cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
  .opt:disabled{cursor:default}
  .opt .letter{
    font-family:"Space Mono",monospace;font-weight:700;font-size:14px;
    width:26px;height:26px;flex:0 0 auto;border-radius:7px;
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--line);color:var(--ink);margin-top:1px;
  }
  .opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}
  .opt.correct .letter{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no-line);background:var(--no-bg)}
  .opt.wrong .letter{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-weight:700;font-size:13px;align-self:center;white-space:nowrap}
  .opt.correct .mark{color:var(--ok)}
  .opt.wrong .mark{color:var(--no)}

  .explain{
    margin:15px 0 0;padding:14px 16px;border-radius:11px;
    border:1px solid var(--line);border-left:3px solid var(--accent);
    background:#faf9f6;font-size:15px;color:#2c2a28;
    display:none;
  }
  .explain.show{display:block;animation:fade .25s ease}
  .explain .lbl{font-weight:700;color:var(--accent);display:block;margin:0 0 3px;font-size:13px;
    font-family:"Bricolage Grotesque",sans-serif;letter-spacing:.01em}
  @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

  /* diagramas */
  .fig{margin:0 0 16px;display:flex;justify-content:center}
  .fig svg{max-width:100%;height:auto;background:#faf9f6;border:1px solid var(--line);border-radius:10px}
  .fig-cap{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-family:"Space Mono",monospace}

  /* resumo da matéria */
  .summary{
    margin:8px 0 0;border-radius:var(--radius);padding:22px 20px;
    background:var(--accent);color:#fff;box-shadow:var(--shadow);
    display:none;
  }
  .summary.show{display:block;animation:fade .3s ease}
  .summary h3{margin:0 0 4px;font-size:20px;font-weight:800}
  .summary .score{font-family:"Space Mono",monospace;font-size:34px;font-weight:700;margin:6px 0 2px}
  .summary p{margin:2px 0 0;opacity:.92;font-size:14.5px}
  .summary .next{
    margin-top:16px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;
    border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;
    transition:.15s;
  }
  .summary .next:hover{background:#fff;color:var(--accent)}

  footer{max-width:820px;margin:0 auto;padding:0 20px 40px;color:var(--ink-soft);font-size:12.5px;text-align:center}

  @media (max-width:560px){
    body{font-size:16px}
    main{padding:20px 15px 80px}
    .card{padding:18px 15px}
    .status-inner,header,.tabs{padding-left:15px;padding-right:15px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <p class="eyebrow">Prática · correção imediata</p>
    <h1>2ª Prova Treino</h1>
    <p class="sub">8º ano — Ensino Fundamental</p>
    <p class="mode-note"><span class="dot"></span>Responda cada questão e veja na hora a resposta certa e o porquê. Sem nota — é treino.</p>
  </div>
</header>

<div class="statusbar">
  <div class="status-inner">
    <div class="stats">
      <div class="stat"><b id="st-answered">0</b><span>de <span id="st-total">0</span> respondidas</span></div>
      <div class="stat acertos"><b id="st-correct">0</b><span>acertos</span></div>
      <button class="btn-reset" id="btn-reset" type="button">Recomeçar</button>
    </div>
    <div class="progress"><i id="progress-bar"></i></div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs" role="tablist" aria-label="Matérias"></div>
</div>

<main id="main"></main>

<footer>
  Prova de treino gerada a partir da 2ª Avaliação Acadêmica · 8º ano. Uso pedagógico interno.
</footer>

<script>
/* ============================================================
   DADOS DA PROVA
   Cada questão: { n, skill, context(html|null), fig(svg|null),
                   statement, options[], correct(index), explain }
   ============================================================ */
const DATA = [
  /* ---------------- LÍNGUA PORTUGUESA ---------------- */
  { id:"lp", name:"Língua Portuguesa", color:"#0d9488", questions:[
    { n:1, skill:"EF69LP40",
      context:`<span class="ctag">Texto</span><p>Vivemos em uma sociedade fortemente marcada pela linguagem audiovisual. Vídeos combinam imagem, som, texto escrito e narração, o que os torna recursos capazes de gerar experiências e despertar a motivação de quem aprende. Nesse cenário, a videoaula ganhou espaço: ela reúne diferentes linguagens em um só material e permite que o estudante não dependa apenas do livro didático e das anotações do caderno. Por integrar vários modos de comunicar, a videoaula se firma como um caminho criativo para o ensino.</p>`,
      statement:`A contextualização feita no texto evidencia que a videoaula é um gênero textual`,
      options:[
        "marcado pela interatividade ao vivo entre interlocutores.",
        "caracterizado por reunir diferentes linguagens em um mesmo material.",
        "voltado exclusivamente ao ensino sobre meios de comunicação.",
        "limitado a transmitir conteúdos apenas em tempo real."
      ], correct:1,
      explain:`O texto associa a videoaula à integração de múltiplas linguagens (imagem, som, texto, narração), característica central do gênero. Ela não exige interação ao vivo nem funciona só em tempo real.` },

    { n:2, skill:"EF08LP07",
      context:`<span class="ctag">Trecho</span><p>“Com o avanço das ferramentas digitais, novas formas de expressão <b>surgiram</b>.”</p>`,
      statement:`O verbo em destaque classifica-se como`,
      options:[
        "intransitivo, pois não necessita de complemento.",
        "transitivo direto, pois é complementado por “novas formas”.",
        "transitivo indireto, pois pede um objeto indireto.",
        "transitivo direto e indireto, pois exige dois complementos."
      ], correct:0,
      explain:`O verbo “surgir” tem sentido completo e não exige objeto. “Novas formas de expressão” é o sujeito, e o verbo é intransitivo.` },

    { n:3, skill:"EF08LP08",
      context:`<span class="ctag">Slogan de campanha</span><p>“<b>Proteja-se</b> da gripe! A vacinação já começou.”</p>`,
      statement:`Campanhas costumam usar linguagem centrada no leitor. No slogan “Proteja-se da gripe!”, o recurso que contribui para esse efeito é o(a)`,
      options:[
        "voz ativa, que caracteriza o leitor como sujeito da ação.",
        "voz reflexiva, que situa o leitor como agente e receptor da ação.",
        "voz passiva analítica, que anula a participação do leitor.",
        "voz passiva sintética, que destaca apenas o aspecto informativo."
      ], correct:1,
      explain:`Em “Proteja-se”, o pronome “se” indica voz reflexiva: o leitor pratica e recebe a ação de proteger, o que centra a mensagem nele.` },

    { n:4, skill:"Currículo SAS",
      context:`<span class="ctag">Cartilha de finanças</span><p>Antes de solicitar um financiamento, o empreendedor deve responder a três perguntas: <b>para que</b> o recurso será usado, <b>quanto</b> dinheiro será necessário e <b>como</b> a dívida será paga. Com essas respostas em mãos, é possível conversar com a instituição financeira e escolher a linha de crédito mais adequada, avaliando se ela deve ser de curto ou de longo prazo.</p>`,
      statement:`No trecho, é possível identificar a presença de`,
      options:[
        "explicações sobre formas de pagamento em comércios.",
        "determinações obrigatórias para quitar empréstimos.",
        "avisos sobre os riscos de não pagar financiamentos.",
        "instruções a serem seguidas antes de pedir um financiamento."
      ], correct:3,
      explain:`O texto orienta o leitor com passos a seguir antes de buscar o financiamento (para quê, quanto e como), o que configura um texto instrucional.` },

    { n:5, skill:"EF08LP09",
      context:`<span class="ctag">Releia</span><p>“…escolher a linha de crédito mais <b>adequada</b>, se ela deve ser de curto ou longo prazo, entre outros fatores.”</p>`,
      statement:`A palavra “adequada” modifica o sentido de`,
      options:[
        "“instituição financeira”, explicando sua função.",
        "“linha de crédito”, descrevendo-a em tom sarcástico.",
        "“instituição financeira”, qualificando-a como exemplar.",
        "“linha de crédito”, caracterizando-a como a opção mais apropriada."
      ], correct:3,
      explain:`“Adequada” é um modificador (adjetivo) do substantivo “linha de crédito”, indicando que a escolha deve recair sobre a opção mais apropriada às condições de quem pede.` },

    { n:6, skill:"EF89LP33",
      context:`<span class="ctag">Conto de ficção científica</span><p>Houve um súbito alvoroço no centro de controle. Pela primeira vez na história da Estação Kairós, um robô de manutenção fugira para fora da área permitida. O mais grave não era a regra que proibia máquinas autônomas no setor externo — regras podiam ser revistas. O que preocupava mesmo era a fala do engenheiro responsável pelas pesquisas.</p><p class="speaker">— Aquele robô foi construído para operar apenas no vácuo, longe de qualquer gravidade. Seu sistema só conhece o silêncio e a ausência de peso. Na superfície do planeta, receberá milhares de estímulos para os quais jamais foi preparado. Impossível prever suas reações! — E, nervoso, passou a mão pela testa suada.</p>`,
      statement:`Uma característica do gênero ficção científica presente no trecho é o(a)`,
      options:[
        "ação centrada em uma aventura com seres mitológicos.",
        "clima de mistério ligado a eventos mágicos e sobrenaturais.",
        "cenário histórico real, sem elementos inventados.",
        "narrativa verossímil associada a elementos tecnológicos."
      ], correct:3,
      explain:`A trama é plausível (verossímil) e gira em torno de robôs e de uma estação espacial, unindo tecnologia e reflexão sobre seus limites — traços típicos da ficção científica.` },

    { n:7, skill:"EF89LP33",
      statement:`A leitura do trecho permite inferir que o(a)`,
      options:[
        "sociedade do futuro desconhece completamente os robôs.",
        "progresso tecnológico sempre substitui o trabalho humano.",
        "inteligência artificial deveria ser proibida no espaço.",
        "funcionamento de uma máquina depende de sua programação específica."
      ], correct:3,
      explain:`A preocupação do engenheiro mostra que o robô, programado só para o vácuo, pode falhar em outro ambiente: o comportamento da máquina depende de como foi programada.` },

    { n:8, skill:"EF08LP10",
      context:`<span class="ctag">Releia</span><p>“<b>Pela primeira vez na história da Estação Kairós</b>, um robô fugira <b>para fora da área permitida</b>.”</p>`,
      statement:`Os adjuntos adverbiais destacados expressam, respectivamente, circunstâncias de`,
      options:[
        "causa e meio.",
        "tempo e lugar.",
        "modo e intensidade.",
        "assunto e instrumento."
      ], correct:1,
      explain:`“Pela primeira vez na história da Estação Kairós” situa o evento no tempo; “para fora da área permitida” indica o lugar. São adjuntos adverbiais de tempo e de lugar.` },

    { n:9, skill:"EF89LP04",
      context:`<span class="ctag">Seção “Cartas do Leitor”</span><p>Nesta semana, o jornal perguntou aos leitores como as escolas podem tornar o esporte mais inclusivo. Confira uma das respostas.</p><p><em>“Como mãe de dois estudantes e apaixonada por esporte, acredito que professores, treinadores e dirigentes precisam receber formação sobre respeito às diferenças. Diante de qualquer atitude preconceituosa, a atividade será interrompida na hora e a ocorrência será registrada. Além disso, penso que campanhas educativas, com palestras e rodas de conversa, ajudariam a criar um ambiente mais acolhedor para todos.”</em> — Marina Alves (Recife, PE)</p>`,
      statement:`Nessa carta, o posicionamento da leitora indica a(o)`,
      options:[
        "necessidade de usar o momento do jogo para discutir problemas.",
        "dever das escolas de premiar apenas os melhores atletas.",
        "obrigação de punir os alunos ao final de cada competição.",
        "importância de formar profissionais para um esporte mais respeitoso e inclusivo."
      ], correct:3,
      explain:`A leitora defende que profissionais recebam formação sobre respeito às diferenças e sugere ações educativas, apontando a importância de um esporte mais inclusivo.` },

    { n:10, skill:"EF08LP11",
      context:`<span class="ctag">Releia</span><p>“A atividade será interrompida na hora <b>e</b> a ocorrência será registrada.”</p>`,
      statement:`Nesse período composto por coordenação, a relação de sentido entre as orações é de`,
      options:[
        "adição.",
        "alternância.",
        "adversidade.",
        "explicação."
      ], correct:0,
      explain:`A conjunção “e” liga as duas orações somando informações — oração coordenada sindética aditiva, ou seja, relação de adição.` }
  ]},

  /* ---------------- MATEMÁTICA ---------------- */
  { id:"mat", name:"Matemática", color:"#2563eb", questions:[
    { n:11, skill:"Currículo SAS",
      context:`<span class="ctag">Dominó matemático</span><p>Em um dominó de expressões, cada peça tem duas extremidades. Para jogar, uma das extremidades da nova peça precisa equivaler a uma das pontas livres já na mesa. As três peças já colocadas deixaram as pontas livres:</p><p><b>(a + b)²</b> &nbsp;[= a² + 2ab + b²] &nbsp;e&nbsp; <b>(a + b)·(a − b)</b> &nbsp;[= a² − b²]</p>`,
      statement:`Qual das peças a seguir é a única possibilidade para a rodada?`,
      options:[
        "a² − 2ab + b²  |  (x + y)²",
        "a² − b²  |  y² − n²",
        "a − b  |  m − n²",
        "a − 2ab − b  |  x² − b²"
      ], correct:1,
      explain:`As pontas livres valem (a+b)² e (a+b)(a−b) = a² − b². A peça precisa conter um produto notável equivalente a uma delas. A peça “a² − b² | y² − n²” traz duas diferenças de dois quadrados, compatíveis com a ponta (a+b)(a−b).` },

    { n:12, skill:"Currículo SAS",
      context:`<span class="ctag">Enunciado</span><p>Certo retângulo tem a área expressa pelo polinômio <b>m³ + 5m² + 3m + 15</b>. Essa área foi obtida pelo produto de dois binômios, que correspondem aos lados do retângulo.</p>`,
      statement:`Quais são esses dois binômios?`,
      options:[
        "(m² + 3) e (m² + 5)",
        "(m² + 3) e (m + 5)",
        "(m + 3) e (m² + 5)",
        "(m + 3) e (m + 5)"
      ], correct:1,
      explain:`Fatorando por agrupamento: m³ + 5m² + 3m + 15 = m²(m + 5) + 3(m + 5) = (m + 5)(m² + 3). Logo, os lados são (m² + 3) e (m + 5).` },

/* ============================================================
   LÓGICA (só em memória — sem localStorage)
   ============================================================ */
const LETTERS = ["A","B","C","D"];
const state = {}; // qKey -> {chosen, correct}
let active = 0;

const tabsEl = document.getElementById("tabs");
const mainEl = document.getElementById("main");
const stAnswered = document.getElementById("st-answered");
const stCorrect  = document.getElementById("st-correct");
const stTotal    = document.getElementById("st-total");
const progressBar= document.getElementById("progress-bar");

const TOTAL = DATA.reduce((s,g)=>s+g.questions.length,0);
stTotal.textContent = TOTAL;

function qKey(gid,n){return gid+"-"+n;}

function buildTabs(){
  tabsEl.innerHTML="";
  DATA.forEach((g,i)=>{
    const b=document.createElement("button");
    b.className="tab";b.type="button";b.setAttribute("role","tab");
    b.setAttribute("aria-selected", i===active ? "true":"false");
    b.style.setProperty("--tab",g.color);
    const answered=g.questions.filter(q=>state[qKey(g.id,q.n)]).length;
    b.innerHTML=`<span class="tdot"></span>${g.name}<span class="tcount">${answered}/${g.questions.length}</span>`;
    b.addEventListener("click",()=>{active=i;render();window.scrollTo({top:0,behavior:"smooth"});});
    tabsEl.appendChild(b);
  });
}

function render(){
  const g=DATA[active];
  document.documentElement.style.setProperty("--accent",g.color);
  document.documentElement.style.setProperty("--accent-soft",g.color+"1a");
  buildTabs();

  mainEl.innerHTML="";
  const head=document.createElement("div");
  head.className="subject-head";
  head.innerHTML=`<h2><span class="bar"></span>${g.name}</h2>
     <p>${g.questions.length} questões · toque em uma alternativa para ver a correção.</p>`;
  mainEl.appendChild(head);

  g.questions.forEach(q=>mainEl.appendChild(buildCard(g,q)));

  // resumo
  const sum=document.createElement("div");
  sum.className="summary";sum.id="summary-"+g.id;
  mainEl.appendChild(sum);
  refreshSummary(g);
}

function buildCard(g,q){
  const card=document.createElement("article");
  card.className="card";
  const key=qKey(g.id,q.n);

  let html=`<div class="card-top">
      <span class="qnum">${String(q.n).padStart(2,"0")}</span>
      <span class="skill">${q.skill}</span>
    </div>`;
  if(q.fig) html+=`<div class="fig">${q.fig}</div>`;
  if(q.context) html+=`<div class="context">${q.context}</div>`;
  html+=`<p class="statement">${q.statement}</p>`;
  html+=`<ul class="options">`;
  q.options.forEach((opt,idx)=>{
    html+=`<li><button class="opt" type="button" data-idx="${idx}">
        <span class="letter">${LETTERS[idx]}</span>
        <span class="otext">${opt}</span>
        <span class="mark"></span>
      </button></li>`;
  });
  html+=`</ul>`;
  html+=`<div class="explain"><span class="lbl">Por que esta é a resposta</span>${q.explain}</div>`;
  card.innerHTML=html;

  const opts=[...card.querySelectorAll(".opt")];
  const explain=card.querySelector(".explain");

  const saved=state[key];
  if(saved){ applyAnswered(opts,explain,q.correct,saved.chosen); }

  opts.forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(state[key]) return;
      const chosen=+btn.dataset.idx;
      state[key]={chosen,correct:chosen===q.correct};
      applyAnswered(opts,explain,q.correct,chosen);
      updateStats();
      buildTabs();
      refreshSummary(g);
    });
  });
  return card;
}

function applyAnswered(opts,explain,correctIdx,chosenIdx){
  opts.forEach((b,i)=>{
    b.disabled=true;
    const mark=b.querySelector(".mark");
    if(i===correctIdx){b.classList.add("correct");mark.textContent="✓ correta";}
    else if(i===chosenIdx){b.classList.add("wrong");mark.textContent="✗ sua escolha";}
  });
  explain.classList.add("show");
}

function updateStats(){
  const vals=Object.values(state);
  const answered=vals.length;
  const correct=vals.filter(v=>v.correct).length;
  stAnswered.textContent=answered;
  stCorrect.textContent=correct;
  progressBar.style.width=(answered/TOTAL*100)+"%";
}

function refreshSummary(g){
  const box=document.getElementById("summary-"+g.id);
  if(!box) return;
  const answered=g.questions.filter(q=>state[qKey(g.id,q.n)]).length;
  const total=g.questions.length;
  if(answered<total){box.classList.remove("show");box.innerHTML="";return;}
  const correct=g.questions.filter(q=>{const s=state[qKey(g.id,q.n)];return s&&s.correct;}).length;
  const pct=Math.round(correct/total*100);
  box.innerHTML=`<h3>Você concluiu ${g.name}!</h3>
    <div class="score">${correct} / ${total}</div>
    <p>${pct}% de acertos nesta matéria.</p>
    ${active<DATA.length-1?`<button class="next" type="button" id="next-btn">Ir para ${DATA[active+1].name} →</button>`:`<p style="margin-top:12px">Você percorreu todas as matérias. Bom treino! 🎉</p>`}`;
  box.classList.add("show");
  const nb=box.querySelector("#next-btn");
  if(nb) nb.addEventListener("click",()=>{active++;render();window.scrollTo({top:0,behavior:"smooth"});});
}

document.getElementById("btn-reset").addEventListener("click",()=>{
  for(const k in state) delete state[k];
  active=0;
  updateStats();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
});

updateStats();
render();
</script>
