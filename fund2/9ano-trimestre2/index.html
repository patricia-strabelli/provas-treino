<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--accent:#0d9488;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--card:#ffffff;--ok:#16a34a;--no:#dc2626}
  body{font-family:'Public Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:16px 16px 80px}
  header.top{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(24px,5vw,34px);letter-spacing:-.02em;line-height:1.05}
  .sub{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;color:var(--accent);font-size:clamp(15px,3.4vw,19px);margin-top:2px}
  .modo{color:var(--muted);font-size:13.5px;margin-top:8px}
  .scorerow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .chip{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .chip .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .chip .val{font-family:'Space Mono',monospace;font-weight:700;font-size:20px;margin-top:2px}
  .progress{height:9px;background:var(--line);border-radius:99px;margin-top:14px;overflow:hidden}
  .progress>span{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
  nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
  nav.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);font-family:'Public Sans';font-weight:600;font-size:13.5px;padding:8px 14px;border-radius:99px;cursor:pointer;transition:.15s;position:relative}
  nav.tabs button .dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;vertical-align:middle}
  nav.tabs button.active{color:#fff;border-color:transparent}
  nav.tabs button .done{font-family:'Space Mono',monospace;font-size:10.5px;opacity:.75;margin-left:6px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
  .qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .qnum{font-family:'Space Mono',monospace;font-weight:700;font-size:14px;color:var(--accent)}
  .skill{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
  .stem{font-size:15.5px}
  .stem p{margin:0 0 8px}
  .stem svg{margin:8px 0}
  .stem em{color:#334155}
  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px}
  .frac .fnum{border-bottom:1.6px solid currentColor;padding:0 5px}
  .frac .fden{padding:0 5px}
  .opts{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;transition:.12s;background:var(--card);font-size:15px}
  .opt:hover{border-color:var(--accent);background:#f9fdfc}
  .opt .key{font-family:'Space Mono',monospace;font-weight:700;color:var(--accent);flex:0 0 auto}
  .opt .txt{flex:1}
  .opt.correct{border-color:var(--ok);background:#f0fdf4}
  .opt.correct .key{color:var(--ok)}
  .opt.wrong{border-color:var(--no);background:#fef2f2}
  .opt.wrong .key{color:var(--no)}
  .opt.locked{cursor:default}
  .opt.dim{opacity:.62}
  .expl{margin-top:12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px;display:none}
  .expl.show{display:block}
  .expl .tag{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
  .expl.right .tag{color:var(--ok)} .expl.rong .tag{color:var(--no)}
  .summary{background:var(--card);border:1px dashed var(--accent);border-radius:16px;padding:16px 18px;margin:4px 0 14px;display:none}
  .summary.show{display:block}
  .summary h3{font-family:'Bricolage Grotesque';font-weight:700;font-size:17px;margin-bottom:4px}
  .summary p{font-size:14px;color:var(--muted)}
  .summary .big{font-family:'Space Mono',monospace;font-weight:700;color:var(--accent);font-size:15px}
  .restart{position:fixed;right:16px;bottom:16px;background:var(--accent);color:#fff;border:none;font-family:'Public Sans';font-weight:700;font-size:14px;padding:12px 18px;border-radius:99px;box-shadow:0 6px 18px rgba(15,23,42,.2);cursor:pointer;z-index:20}
  .restart:active{transform:translateY(1px)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
  @media(max-width:520px){.skill{max-width:48%}.opt{font-size:14.5px}.stem{font-size:15px}}
</style>
</head>

    <div class="sub">9º ano · Ensino Fundamental</div>
    <p class="modo">Modo prática, sem nota. Responda cada questão e receba a correção na hora, com uma explicação. Sua sessão fica apenas na memória do navegador.</p>

<script>
var MATERIAS = [{"nome":"Língua Portuguesa","cor":"#0d9488","questoes":[{"n":1,"skill":"EF89LP33","correta":"d","enunciado":"<p><strong>Texto 1</strong> — O lambe-lambe é uma manifestação artística urbana em que cartazes com mensagens, poemas ou ilustrações são colados em muros e postes das cidades. Mais do que divulgar informação, ele transforma o espaço público em suporte para a expressão criativa.</p><p><strong>Texto 2</strong> — Em um poste de uma avenida movimentada, alguém colou um cartaz branco onde se lia, em letras grandes: <em>\"Guardei o inverno inteiro dentro do bolso só para ter uma desculpa de sentir frio perto de você.\"</em></p><p>Considerando o Texto 1, o Texto 2 pertence ao gênero lambe-lambe porque</p>","alternativas":{"a":"apresenta linguagem técnica voltada à informação.","b":"descreve um acontecimento jornalístico da cidade.","c":"organiza dados estatísticos sobre o espaço urbano.","d":"está fixado em espaço urbano e traz uma mensagem poética."},"explicacao":"O lambe-lambe é um cartaz artístico colado em espaços urbanos. O Texto 2 se enquadra nesse gênero porque está afixado em um poste (espaço público) e apresenta uma mensagem poética, com jogo de sentidos entre o frio do inverno e o afeto."},{"n":2,"skill":"EF09LP04","correta":"a","enunciado":"<p>Leia a frase: <em>\"Percebendo o perigo, o motorista reduziu a velocidade.\"</em></p><p>A oração \"Percebendo o perigo\" é uma oração reduzida de gerúndio. Uma versão desenvolvida dessa frase, sem alteração de sentido, seria:</p>","alternativas":{"a":"Como percebeu o perigo, o motorista reduziu a velocidade.","b":"Para perceber o perigo, o motorista reduziu a velocidade.","c":"Embora percebesse o perigo, o motorista reduziu a velocidade.","d":"Depois de reduzir a velocidade, o motorista percebeu o perigo."},"explicacao":"Desenvolver uma oração reduzida é retirar o verbo da forma nominal (gerúndio) e acrescentar um conectivo adequado. Aqui, a oração expressa a causa da atitude; por isso, a versão desenvolvida usa o conectivo causal \"Como\"."},{"n":3,"skill":"EF89LP32","correta":"d","enunciado":"<p>Um lambe-lambe colado em um muro trazia os dizeres: <em>\"VENDE-SE: coragem usada, pouco rodada, ideal para quem cansou de ter medo. Tratar com você mesmo.\"</em></p><p>A apropriação de um gênero textual é um tipo de intertextualidade. No lambe-lambe descrito, a relação intertextual pode ser percebida no(a)</p>","alternativas":{"a":"uso de linguagem formal típica de documentos oficiais.","b":"tentativa de divulgar uma notícia de grande circulação.","c":"reprodução literal de um anúncio comercial verdadeiro.","d":"emprego de características de um anúncio para tratar de algo abstrato."},"explicacao":"A intertextualidade por apropriação ocorre quando um texto assume a forma de outro gênero. O lambe-lambe usa expressões típicas de anúncio (\"VENDE-SE\", \"Tratar com\"), mas não vende um objeto real: refere-se metaforicamente à \"coragem\", algo abstrato."},{"n":4,"skill":"EF69LP56","correta":"d","enunciado":"<p>Leia o verso: <em>\"Nem tudo são certezas neste caminho.\"</em></p><p>No verso, a forma verbal \"são\" está no plural porque concorda não com o pronome que a antecede, mas com o predicativo do sujeito (\"certezas\"). Em qual das frases é possível identificar a MESMA regra de concordância para o verbo \"ser\"?</p>","alternativas":{"a":"As respostas são sempre bem-vindas aqui.","b":"Eles são os últimos a chegar hoje?","c":"Nós somos parte desta história agora.","d":"Quem são os convidados desta cerimônia?"},"explicacao":"Quando o sujeito do verbo \"ser\" é um pronome indefinido, demonstrativo ou interrogativo, o verbo costuma concordar com o predicativo. Na alternativa D, \"são\" vem depois do pronome interrogativo \"Quem\" e vai ao plural para concordar com \"os convidados\"."},{"n":5,"skill":"EF09LP04","correta":"a","enunciado":"<p>Leia a sinopse a seguir, escrita para um livro imaginário:</p><p><em>\"O romance se passa em uma pequena vila onde os moradores enfrentam uma longa seca e decidem construir juntos um grande poço. A obra mostra como a solidariedade transforma o vilarejo.\"</em></p><p>No texto, é possível observar a presença de <strong>período misto</strong> (com orações coordenadas e subordinadas) em:</p>","alternativas":{"a":"\"O romance se passa em uma pequena vila onde os moradores enfrentam uma longa seca e decidem construir juntos um grande poço.\"","b":"\"A obra mostra como a solidariedade transforma o vilarejo.\"","c":"\"O romance se passa em uma pequena vila.\"","d":"\"Os moradores enfrentam uma longa seca.\""},"explicacao":"Um período misto reúne orações coordenadas e subordinadas. Na alternativa A há a oração principal, uma subordinada adjetiva (\"onde os moradores enfrentam uma longa seca\") e uma coordenada aditiva (\"e decidem construir juntos um grande poço\")."},{"n":6,"skill":"EF89LP33","correta":"b","enunciado":"<p>Leia o trecho a seguir, de uma narrativa policial.</p><p><em>\"O inspetor girou o anel vazio entre os dedos. A pedra havia sumido durante o jantar, e todos os convidados juravam nada ter visto. — Alguém entrou nesta sala depois das nove? — perguntou. A governanta hesitou antes de responder, e foi essa hesitação que o inspetor guardou para depois.\"</em></p><p>Um aspecto desse trecho que o caracteriza como parte de uma narrativa policial é(são)</p>","alternativas":{"a":"as personagens, que representam classes sociais em conflito.","b":"o enredo, que gira em torno de um crime e cria mistério e tensão.","c":"o narrador, que participa da história e distorce os fatos.","d":"a linguagem, que é informal e cheia de gírias."},"explicacao":"As narrativas policiais e de suspense giram, em geral, em torno de crimes, mistérios e tensões. No trecho, o desaparecimento da pedra instaura o mistério sobre o culpado, e a hesitação da governanta reforça a tensão."},{"n":7,"skill":"EF69LP56","correta":"b","enunciado":"<p>Observe a palavra em destaque no trecho:</p><p><em>\"As <strong>renomadas</strong> Universidade de Coimbra e Universidade de Bolonha figuram entre as instituições mais antigas do mundo.\"</em></p><p>O termo destacado está no plural porque</p>","alternativas":{"a":"assume a função de predicativo do sujeito.","b":"faz referência a dois substantivos próprios.","c":"concorda apenas com o substantivo mais próximo.","d":"refere-se a substantivos de gêneros diferentes."},"explicacao":"Na concordância nominal, um adjetivo que antecede dois ou mais substantivos próprios costuma ir para o plural. \"Renomadas\" está no plural porque se refere aos dois nomes próprios que vêm depois: \"Universidade de Coimbra\" e \"Universidade de Bolonha\"."},{"n":8,"skill":"EF69LP02","correta":"b","enunciado":"<p>Leia a descrição de uma peça publicitária de campanha de saúde:</p><p>A peça mostra a fotografia de uma mesa de jantar com um lugar vazio, cadeira afastada e prato intocado. Ao lado, lê-se: <em>\"A dengue pode roubar dias da sua vida. Ou a sua vida inteira. Não deixe o mosquito vencer.\"</em></p><p>Nessa peça, o recurso não verbal (a fotografia) é utilizado para</p>","alternativas":{"a":"suavizar a mensagem, mostrando um ambiente acolhedor.","b":"reforçar a seriedade da doença, sugerindo uma possível consequência grave.","c":"relativizar o problema, apresentando uma situação improvável.","d":"informar dados estatísticos sobre o número de casos."},"explicacao":"A fotografia do lugar vazio à mesa sugere a ausência de alguém — associada ao texto, reforça a seriedade da dengue ao apontar a perda da vida como consequência possível."},{"n":9,"skill":"EF69LP04","correta":"d","enunciado":"<p>Leia a descrição de duas peças de uma mesma campanha de turismo:</p><p><strong>Peça 1</strong> — sobre a foto de uma praia ao entardecer: <em>\"ENCANTO. Aqui o mar encontra a serra. Venha descobrir o destino dos seus sonhos.\"</em></p><p><strong>Peça 2</strong> — sobre a foto de uma cachoeira: <em>\"AVENTURA. Trilhas, quedas-d'água e ar puro esperam por você. Escolha o seu próximo destino.\"</em></p><p>Nas peças, a associação entre a linguagem verbal e a não verbal cumpre o objetivo de</p>","alternativas":{"a":"esclarecer dúvidas técnicas sobre cada ponto turístico.","b":"apresentar dados sobre o número de visitantes das cidades.","c":"propor novas formas de administrar o turismo local.","d":"reforçar aspectos que tornam os lugares um destino desejável ao leitor."},"explicacao":"O texto verbal (\"Encanto\", \"Aventura\", \"destino dos seus sonhos\") e as imagens das paisagens se articulam para valorizar os lugares, reforçando características que os tornam destinos desejáveis para o leitor."},{"n":10,"skill":"EF89LP21","correta":"a","enunciado":"<p><strong>Texto 1</strong> — A enquete é uma pesquisa de opinião simples, feita com uma pergunta objetiva, que permite a qualquer pessoa registrar seu posicionamento sobre um tema de interesse coletivo.</p><p><strong>Texto 2</strong> — <em>Enquete encerrada</em> — \"Você é a favor da criação de mais ciclovias na sua cidade?\" &nbsp;Sim: 78% · Não: 17% · Não tenho opinião: 5%. &nbsp;Total: 40.312 votos.</p><p>Qual é o principal objetivo da enquete apresentada no Texto 2?</p>","alternativas":{"a":"Consultar a população a respeito de um tema de interesse coletivo.","b":"Informar a população sobre a obrigatoriedade de uma nova lei.","c":"Divulgar dados científicos sobre a mobilidade urbana.","d":"Apresentar os nomes dos participantes da pesquisa."},"explicacao":"A enquete é uma pesquisa objetiva que consulta a opinião das pessoas sobre um assunto. No Texto 2, o objetivo é consultar a população sobre um tema de interesse coletivo — a criação de mais ciclovias."}]},{"nome":"Matemática","cor":"#2563eb","questoes":[{"n":11,"skill":"EF09MA09","correta":"c","enunciado":"<p>O professor Breno apresentou a expressão algébrica 27x³ + 8 e pediu que os alunos escolhessem, entre as placas abaixo, as duas que, multiplicadas, resultassem nessa expressão.</p><p><strong>Placa I:</strong> 9x + 4 &nbsp;·&nbsp; <strong>Placa II:</strong> 3x + 2 &nbsp;·&nbsp; <strong>Placa III:</strong> 9x² − 6x + 4 &nbsp;·&nbsp; <strong>Placa IV:</strong> 3x² + 6x − 2</p><p>Quais placas os alunos escolheram?</p>","alternativas":{"a":"I e IV","b":"I e III","c":"II e III","d":"II e IV"},"explicacao":"27x³ + 8 é uma soma de dois cubos: (3x)³ + 2³. Aplicando a³ + b³ = (a + b)(a² − ab + b²), com a = 3x e b = 2, obtém-se (3x + 2)(9x² − 6x + 4). Logo, placas II e III."},{"n":12,"skill":"EF09MA09","correta":"d","enunciado":"<p>O polinômio x² − 9x + 14 representa o faturamento mensal de uma empresa, obtido pela multiplicação de dois binômios. A forma fatorada desse polinômio é:</p>","alternativas":{"a":"(x + 2) · (x + 7)","b":"(x − 2) · (x + 7)","c":"(x − 7) · (x + 2)","d":"(x − 7) · (x − 2)"},"explicacao":"Procuram-se dois números cuja soma seja −9 e cujo produto seja 14: são −2 e −7. Logo, x² − 9x + 14 = (x − 2)(x − 7) = (x − 7)(x − 2)."},{"n":13,"skill":"EF09MA09","correta":"a","enunciado":"<p>Para qualquer número real x, com x ≠ 3 e x ≠ −3, a forma mais simples da fração algébrica <span class=\"frac\"><span class=\"fnum\">xy + 2x − 3y − 6</span><span class=\"fden\">x² − 9</span></span> é:</p>","alternativas":{"a":"<span class=\"frac\"><span class=\"fnum\">y + 2</span><span class=\"fden\">x + 3</span></span>","b":"<span class=\"frac\"><span class=\"fnum\">y − 2</span><span class=\"fden\">x + 3</span></span>","c":"<span class=\"frac\"><span class=\"fnum\">y + 2</span><span class=\"fden\">x − 3</span></span>","d":"<span class=\"frac\"><span class=\"fnum\">y − 2</span><span class=\"fden\">x − 3</span></span>"},"explicacao":"Fatorando o numerador por agrupamento: x(y + 2) − 3(y + 2) = (x − 3)(y + 2). O denominador é (x + 3)(x − 3). Simplificando o fator (x − 3), resulta (y + 2)/(x + 3)."},{"n":14,"skill":"EF09MA09","correta":"b","enunciado":"<p>No projeto de um brinquedo, os pontos de entrada e saída são dados pelas raízes da equação 0,25x² + mx + 4 = 0, em que m é constante real. Para que as raízes sejam reais e iguais, o menor valor de m deve ser igual a:</p>","alternativas":{"a":"−4","b":"−2","c":"2","d":"4"},"explicacao":"Para raízes reais e iguais, o discriminante é zero: Δ = m² − 4·(0,25)·4 = m² − 4 = 0 → m = ±2. O menor valor é −2."},{"n":15,"skill":"EF09MA09","correta":"d","enunciado":"<p>Ana comprou um porta-retratos com espaço quadrado de x cm de lado para a foto. Precisará de outro, retangular, com o <strong>dobro da área</strong> do anterior, sendo 20 cm maior na altura e 30 cm maior na largura. A área do novo porta-retratos pode ser representada pela equação:</p>","alternativas":{"a":"x² = (x + 10)(x + 15)","b":"x² = (x + 20)(x + 30)","c":"2x² = (x + 10)(x + 15)","d":"2x² = (x + 20)(x + 30)"},"explicacao":"A área do espaço quadrado é x²; o dobro é 2x². As novas dimensões são (x + 20) e (x + 30), cujo produto é a nova área. Assim, 2x² = (x + 20)(x + 30)."},{"n":16,"skill":"EF09MA09","correta":"d","enunciado":"<p><em>(Continuação)</em> A partir da equação 2x² = (x + 20)(x + 30), a maior dimensão do novo porta-retratos, em centímetros, é de:</p>","alternativas":{"a":"60","b":"70","c":"80","d":"90"},"explicacao":"Desenvolvendo: 2x² = x² + 50x + 600 → x² − 50x − 600 = 0. Δ = 2 500 + 2 400 = 4 900, √Δ = 70. x = (50 + 70)/2 = 60 (a raiz negativa é descartada). A maior dimensão é x + 30 = 90 cm."},{"n":17,"skill":"EF09MA17","correta":"b","enunciado":"<p>Uma peça foi montada com 4 cubos iguais: três cubos formam uma base em linha reta e, sobre o cubo da extremidade direita, foi colocado mais um cubo. Qual das figuras a seguir representa a <strong>vista frontal</strong> dessa peça?</p>","alternativas":{"a":"<svg viewBox=\"0 0 78 52\" width=\"78\" height=\"52\" style=\"vertical-align:middle\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"52\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"0\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"52\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/></svg>","b":"<svg viewBox=\"0 0 78 52\" width=\"78\" height=\"52\" style=\"vertical-align:middle\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"52\" y=\"0\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"0\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"52\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/></svg>","c":"<svg viewBox=\"0 0 78 52\" width=\"78\" height=\"52\" style=\"vertical-align:middle\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"52\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"0\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"52\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/></svg>","d":"<svg viewBox=\"0 0 78 52\" width=\"78\" height=\"52\" style=\"vertical-align:middle\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"52\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"0\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"52\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/></svg>"},"explicacao":"A vista frontal mostra três quadrados na base e um quadrado acima, à direita (onde há o cubo empilhado). Esse é o formato da alternativa B."},{"n":18,"skill":"EF09MA17","correta":"c","enunciado":"<p>Um objeto em forma de escada foi montado com cubos iguais: o degrau da esquerda tem 2 cubos de altura e o da direita tem 1 cubo de altura, ambos com 1 cubo de profundidade. Qual figura representa a <strong>vista lateral</strong> (de perfil) desse objeto?</p>","alternativas":{"a":"<svg viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" style=\"vertical-align:middle\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"0\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/></svg>","b":"<svg viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" style=\"vertical-align:middle\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"0\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/></svg>","c":"<svg viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" style=\"vertical-align:middle\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"0\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/></svg>","d":"<svg viewBox=\"0 0 52 52\" width=\"52\" height=\"52\" style=\"vertical-align:middle\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"0\" width=\"26\" height=\"26\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"0\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"26\" width=\"26\" height=\"26\" fill=\"#475569\" stroke=\"#64748b\" stroke-width=\"1.5\"/></svg>"},"explicacao":"Vista de perfil da escada: a coluna da esquerda tem 2 quadrados (2 cubos de altura) e a da direita tem 1 quadrado na parte inferior. Esse é o contorno em degrau da alternativa C."},{"n":19,"skill":"EF09MA16","correta":"c","enunciado":"<p>Em um plano cartesiano, os pontos P(3, 7) e Q(11, 1) indicam a posição inicial de um extintor e o foco de um incêndio. Cada unidade da malha corresponde a 1 metro. Deslocando-se em linha reta de P até Q, a distância percorrida, em metros, foi de:</p><svg viewBox=\"0 0 300 210\" width=\"300\" height=\"210\" style=\"max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\n<line x1=\"32\" y1=\"30\" x2=\"32\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"52\" y1=\"30\" x2=\"52\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"72\" y1=\"30\" x2=\"72\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"92\" y1=\"30\" x2=\"92\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"112\" y1=\"30\" x2=\"112\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"132\" y1=\"30\" x2=\"132\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"152\" y1=\"30\" x2=\"152\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"172\" y1=\"30\" x2=\"172\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"192\" y1=\"30\" x2=\"192\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"212\" y1=\"30\" x2=\"212\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"232\" y1=\"30\" x2=\"232\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"252\" y1=\"30\" x2=\"252\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"272\" y1=\"30\" x2=\"272\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"32\" y1=\"190\" x2=\"272\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"32\" y1=\"170\" x2=\"272\" y2=\"170\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"32\" y1=\"150\" x2=\"272\" y2=\"150\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"32\" y1=\"130\" x2=\"272\" y2=\"130\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"32\" y1=\"110\" x2=\"272\" y2=\"110\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"32\" y1=\"90\" x2=\"272\" y2=\"90\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"32\" y1=\"70\" x2=\"272\" y2=\"70\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"32\" y1=\"50\" x2=\"272\" y2=\"50\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><line x1=\"32\" y1=\"30\" x2=\"272\" y2=\"30\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n<line x1=\"32\" y1=\"190\" x2=\"278\" y2=\"190\" stroke=\"#334155\" stroke-width=\"1.6\"/>\n<line x1=\"32\" y1=\"24\" x2=\"32\" y2=\"190\" stroke=\"#334155\" stroke-width=\"1.6\"/>\n<line x1=\"92\" y1=\"50\" x2=\"252\" y2=\"170\" stroke=\"#2563eb\" stroke-width=\"2.2\"/>\n<circle cx=\"92\" cy=\"50\" r=\"4\" fill=\"#2563eb\"/><text x=\"80\" y=\"44\" font-size=\"12\" fill=\"#1e293b\" font-weight=\"700\">P</text>\n<circle cx=\"252\" cy=\"170\" r=\"4\" fill=\"#2563eb\"/><text x=\"258\" y=\"168\" font-size=\"12\" fill=\"#1e293b\" font-weight=\"700\">Q</text>\n<text x=\"90\" y=\"203\" font-size=\"9\" fill=\"#64748b\">3</text>\n<text x=\"250\" y=\"203\" font-size=\"9\" fill=\"#64748b\">11</text>\n<text x=\"18\" y=\"53\" font-size=\"9\" fill=\"#64748b\">7</text>\n<text x=\"18\" y=\"173\" font-size=\"9\" fill=\"#64748b\">1</text>\n</svg>","alternativas":{"a":"6","b":"8","c":"10","d":"14"},"explicacao":"d = √[(11 − 3)² + (1 − 7)²] = √[64 + 36] = √100 = 10 metros."},{"n":20,"skill":"EF09MA14","correta":"c","enunciado":"<p>Um palco tem o formato de um trapézio isósceles: base maior 20 m, base menor 10 m e lados não paralelos de 13 m. A distância entre os lados paralelos do palco (a altura do trapézio), em metros, é:</p><svg viewBox=\"0 0 320 210\" width=\"320\" height=\"210\" style=\"max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\n<polygon points=\"60,175 260,175 210,55 110,55\" fill=\"#eff6ff\" stroke=\"#2563eb\" stroke-width=\"2\"/>\n<line x1=\"110\" y1=\"55\" x2=\"110\" y2=\"175\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n<line x1=\"210\" y1=\"55\" x2=\"210\" y2=\"175\" stroke=\"#94a3b8\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n<text x=\"150\" y=\"48\" font-size=\"12\" fill=\"#1e293b\">10 m</text>\n<text x=\"150\" y=\"195\" font-size=\"12\" fill=\"#1e293b\">20 m</text>\n<text x=\"66\" y=\"112\" font-size=\"12\" fill=\"#1e293b\">13 m</text>\n<text x=\"232\" y=\"112\" font-size=\"12\" fill=\"#1e293b\">13 m</text>\n<text x=\"150\" y=\"122\" font-size=\"12\" fill=\"#334155\" font-weight=\"700\">Palco</text>\n<text x=\"82\" y=\"192\" font-size=\"10\" fill=\"#64748b\">5 m</text>\n<text x=\"212\" y=\"192\" font-size=\"10\" fill=\"#64748b\">5 m</text>\n<text x=\"115\" y=\"120\" font-size=\"11\" fill=\"#475569\" font-style=\"italic\">h</text>\n</svg>","alternativas":{"a":"5","b":"8","c":"12","d":"13"},"explicacao":"Traçando as alturas, formam-se triângulos retângulos de base (20 − 10)/2 = 5 m e hipotenusa 13 m. Por Pitágoras: h² + 5² = 13² → h² = 144 → h = 12 m."}]},{"nome":"Inglês","cor":"#dc2626","questoes":[{"n":21,"skill":"Currículo SAS: para além da BNCC","correta":"d","enunciado":"<p>Read the text.</p><p><em>\"English has become the main language of international science. Since the early 2000s, most global conferences have been held in English, and researchers from many countries have published their work in this language. This shift has opened new opportunities for scientists who once presented only in their mother tongue.\"</em></p><p>In the text, the use of the expression \"since\" associated with the present perfect emphasizes</p>","alternativas":{"a":"the exact quantity of time in a situation.","b":"the end of a situation that started in the past.","c":"an action that happened only once in the past.","d":"the beginning of a situation that continues into the present."},"explicacao":"O uso de \"since\" com o present perfect (\"Since the early 2000s… have been held\") marca o início de uma situação que começou no passado e continua no presente."},{"n":22,"skill":"EF09LI18","correta":"a","enunciado":"<p>Read the text.</p><p><em>\"A teenager named Lucas built a small drone able to carry a first-aid kit. He got the idea after learning that, in emergencies, every minute counts before an ambulance arrives. His drone can reach a person having a heart attack in seconds, deliver medication, and send images to a medical team.\"</em></p><p><strong>Vocabulary:</strong> <em>first-aid kit</em> — kit de primeiros socorros.</p><p>The invention created by Lucas is an example of innovation that can</p>","alternativas":{"a":"save lives.","b":"optimize school studies.","c":"entertain small children.","d":"replace medical doctors."},"explicacao":"A invenção é um drone que leva socorro rapidamente a quem sofre um ataque cardíaco, entregando medicação e enviando imagens à equipe médica — uma inovação que pode salvar vidas."},{"n":23,"skill":"EF09LI06","correta":"c","enunciado":"<p>Read the text.</p><p><em>\"Maria Santos is a volunteer who reads books to children at a city hospital. She works with a local project that supports young patients during long treatments. The project offers books, games and reading sessions every week. 'Reading opens doors for these kids. It is the most beautiful work I have ever done,' says Maria. She also invites teenagers to write their own short stories.\"</em></p><p>In the text, which statement expresses an <strong>opinion</strong>?</p>","alternativas":{"a":"\"Maria Santos is a volunteer who reads books to children.\"","b":"\"She works with a local project that supports young patients.\"","c":"\"It is the most beautiful work I have ever done.\"","d":"\"The project offers books, games and reading sessions every week.\""},"explicacao":"Fatos podem ser verificados; opiniões expressam um ponto de vista pessoal. \"It is the most beautiful work I have ever done\" é uma avaliação pessoal de Maria — portanto, uma opinião."},{"n":24,"skill":"EF09LI05","correta":"b","enunciado":"<p>Read the description of an advertisement from a health campaign.</p><p>The poster shows a person surrounded by trees, rivers and animals. In large letters, it reads: <em>\"Our air. Our water. Our health. Protect our planet and protect ourselves.\"</em></p><p>In this advertisement, the persuasive resource that stands out is</p>","alternativas":{"a":"the use of technical and scientific data.","b":"the emotional appeal established by the pronoun \"our\".","c":"the use of hashtags as an ironic element.","d":"the presence of images with no relation to the text."},"explicacao":"A repetição do pronome possessivo \"our\" (\"Our air. Our water. Our health.\") cria um apelo emocional, sugerindo que cuidar do planeta é cuidar de nós mesmos — o principal recurso persuasivo."},{"n":25,"skill":"Currículo SAS: para além da BNCC","correta":"c","enunciado":"<p>Read the sentence.</p><p><em>\"I have searched every street and every corner of this city, but I still haven't found the little bookshop my grandfather told me about.\"</em></p><p>In the sentence, the use of the adverb \"still\" indicates</p>","alternativas":{"a":"an action that has just been completed.","b":"a journey that has not yet begun.","c":"an action that has not been completed yet.","d":"an activity finished a long time ago."},"explicacao":"O advérbio \"still\", ligado ao present perfect no negativo (\"still haven't found\"), indica que a ação ainda não foi concluída: a pessoa procurou muito, mas ainda não encontrou a livraria."}]},{"nome":"Biologia","cor":"#16a34a","questoes":[{"n":26,"skill":"Currículo SAS: para além da BNCC","correta":"a","enunciado":"<p>O RNA participa da síntese de proteínas. Entre os principais tipos estão o RNA mensageiro (RNAm), o RNA transportador (RNAt) e o RNA ribossômico (RNAr). O RNAm funciona como intermediário entre o gene que codifica uma proteína e o produto proteico final.</p><p>Com base nessas informações, o RNAm tem a função de</p>","alternativas":{"a":"carregar a informação genética contida no DNA.","b":"sintetizar cópias das moléculas de material genético.","c":"transportar aminoácidos para a síntese de novas proteínas.","d":"constituir o local onde ocorre a tradução da informação genética."},"explicacao":"O RNAm leva a informação genética do DNA até o local de síntese das proteínas, na forma de códons. O transporte de aminoácidos cabe ao RNAt, e o local de tradução envolve o RNAr."},{"n":27,"skill":"Currículo SAS: para além da BNCC","correta":"d","enunciado":"<p>Existem dois grandes tipos de células: as procarióticas, como as bactérias, e as eucarióticas, como as células animais e vegetais. Uma delas possui uma estrutura que envolve e protege o material genético, separando-o do citoplasma.</p><p>Um aspecto que diferencia esses dois tipos de células é a presença, em apenas uma delas, de</p>","alternativas":{"a":"ribossomo.","b":"citoplasma.","c":"material genético.","d":"envoltório nuclear."},"explicacao":"O envoltório nuclear (carioteca) envolve o núcleo e separa o material genético do citoplasma. Está presente nas células eucarióticas e ausente nas procarióticas. Ribossomo, citoplasma e material genético existem em ambas."},{"n":28,"skill":"Currículo SAS: para além da BNCC","correta":"c","enunciado":"<p>A cura de carnes é uma técnica antiga de conservação que usa sal, açúcar e outros compostos. Uma quantidade suficiente de sal inibe o crescimento de micro-organismos ao alterar o gradiente de concentração: a concentração de soluto fica maior fora das células do que dentro delas.</p><p>Essa alteração no gradiente de concentração favorece o(a)</p>","alternativas":{"a":"gasto de energia no meio extracelular das células do alimento.","b":"transporte ativo de sal para dentro das células microbianas.","c":"redução da quantidade de água no interior das células do alimento.","d":"aumento da quantidade de água no interior das células microbianas."},"explicacao":"A cura envolve a osmose (transporte passivo). Como o meio externo fica mais concentrado, a água atravessa a membrana de dentro para fora, reduzindo a quantidade de água no interior das células e dificultando a sobrevivência dos micro-organismos."},{"n":29,"skill":"Currículo SAS: para além da BNCC","correta":"a","enunciado":"<p>Uma pesquisa investigou a autofagia, mecanismo de digestão celular que degrada e recicla componentes das próprias células, como organelas defeituosas (entre elas, mitocôndrias danificadas). Esse processo tem sido associado ao envelhecimento.</p><p>O mecanismo citado é realizado por qual organela citoplasmática?</p>","alternativas":{"a":"Lisossomo","b":"Peroxissomo","c":"Complexo golgiense","d":"Retículo endoplasmático"},"explicacao":"A autofagia é a digestão de constituintes da própria célula, realizada por enzimas contidas em pequenas bolsas membranosas chamadas lisossomos."},{"n":30,"skill":"EF09CI08","correta":"d","enunciado":"<p>A síndrome de Turner é uma condição genética que afeta mulheres. Ela é caracterizada por uma alteração na quantidade de cromossomos sexuais: mais frequentemente, ocorre a ausência de um cromossomo X, resultando no cariótipo 45,X.</p><p>A síndrome descrita decorre de uma alteração cromossômica</p>","alternativas":{"a":"estrutural chamada de deleção.","b":"numérica chamada de euploidia.","c":"estrutural chamada de duplicação.","d":"numérica chamada de aneuploidia."},"explicacao":"A ausência de um cromossomo (2n − 1) altera o número de cromossomos, não a estrutura. Essa alteração numérica é a aneuploidia (mais especificamente, monossomia)."}]},{"nome":"Física","cor":"#4338ca","questoes":[{"n":31,"skill":"Currículo SAS: para além da BNCC","correta":"b","enunciado":"<p>Um ônibus foi da escola a um bosque a pouco mais de 20 km. O trajeto está dividido por placas nas posições: U (5 km), X (10 km), Y (15 km) e Z (20 km); o bosque fica logo após os 20 km. O ônibus manteve velocidade média de 50 km/h.</p><svg viewBox=\"0 0 320 82\" width=\"320\" height=\"82\" style=\"max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\n<line x1=\"24\" y1=\"48\" x2=\"312\" y2=\"48\" stroke=\"#334155\" stroke-width=\"1.8\"/>\n<line x1=\"24\" y1=\"40\" x2=\"24\" y2=\"56\" stroke=\"#334155\" stroke-width=\"1.4\"/><text x=\"24\" y=\"34\" font-size=\"10\" fill=\"#1e293b\" text-anchor=\"middle\">Escola</text><text x=\"24\" y=\"70\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">0</text><line x1=\"84\" y1=\"40\" x2=\"84\" y2=\"56\" stroke=\"#334155\" stroke-width=\"1.4\"/><text x=\"84\" y=\"34\" font-size=\"10\" fill=\"#1e293b\" text-anchor=\"middle\">U</text><text x=\"84\" y=\"70\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">5</text><line x1=\"144\" y1=\"40\" x2=\"144\" y2=\"56\" stroke=\"#334155\" stroke-width=\"1.4\"/><text x=\"144\" y=\"34\" font-size=\"10\" fill=\"#1e293b\" text-anchor=\"middle\">X</text><text x=\"144\" y=\"70\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">10</text><line x1=\"204\" y1=\"40\" x2=\"204\" y2=\"56\" stroke=\"#334155\" stroke-width=\"1.4\"/><text x=\"204\" y=\"34\" font-size=\"10\" fill=\"#1e293b\" text-anchor=\"middle\">Y</text><text x=\"204\" y=\"70\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">15</text><line x1=\"264\" y1=\"40\" x2=\"264\" y2=\"56\" stroke=\"#334155\" stroke-width=\"1.4\"/><text x=\"264\" y=\"34\" font-size=\"10\" fill=\"#1e293b\" text-anchor=\"middle\">Z</text><text x=\"264\" y=\"70\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">20</text>\n<circle cx=\"300\" cy=\"48\" r=\"4\" fill=\"#4338ca\"/>\n<text x=\"300\" y=\"34\" font-size=\"9\" fill=\"#4338ca\" text-anchor=\"middle\">bosque</text>\n<text x=\"310\" y=\"70\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"end\">S (km)</text>\n</svg><p>Após 0,25 hora de viagem, o veículo estava localizado entre a(s)</p>","alternativas":{"a":"placas Y e Z.","b":"placas X e Y.","c":"escola e a placa U.","d":"placa Z e o bosque."},"explicacao":"ΔS = v · Δt = 50 · 0,25 = 12,5 km. Como X está em 10 km e Y em 15 km, o ônibus estava entre as placas X e Y."},{"n":32,"skill":"Currículo SAS: para além da BNCC","correta":"d","enunciado":"<p>Em uma prova de automobilismo, um carro partiu do repouso e levou 9 segundos para atingir sua velocidade máxima, de 103,5 m/s.</p><p>A aceleração média do veículo nesse intervalo, em m/s², equivale a</p>","alternativas":{"a":"41,4","b":"34,5","c":"17,2","d":"11,5"},"explicacao":"a = (v − v₀)/(t − t₀) = (103,5 − 0)/(9 − 0) = 11,5 m/s²."},{"n":33,"skill":"Currículo SAS: para além da BNCC","correta":"d","enunciado":"<p>O gráfico representa a velocidade de um drone em função do tempo. A velocidade parte de um valor negativo (v₀) em t = 0; cresce até v₁ em t = 2 s; fica constante entre 2 s e 4 s; volta a crescer até v₂ em t = 7 s; e depois diminui até zerar.</p><svg viewBox=\"0 0 300 210\" width=\"300\" height=\"210\" style=\"max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\n<line x1=\"34\" y1=\"20\" x2=\"34\" y2=\"196\" stroke=\"#334155\" stroke-width=\"1.6\"/>\n<line x1=\"34\" y1=\"140\" x2=\"286\" y2=\"140\" stroke=\"#334155\" stroke-width=\"1.6\"/>\n<text x=\"6\" y=\"18\" font-size=\"11\" fill=\"#334155\">v (m/s)</text>\n<text x=\"262\" y=\"158\" font-size=\"11\" fill=\"#334155\">t (s)</text>\n<line x1=\"88\" y1=\"100\" x2=\"88\" y2=\"145\" stroke=\"#cbd5e1\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n<line x1=\"142\" y1=\"100\" x2=\"142\" y2=\"145\" stroke=\"#cbd5e1\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n<line x1=\"223\" y1=\"50\" x2=\"223\" y2=\"145\" stroke=\"#cbd5e1\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n<polyline points=\"34,180 88,100 142,100 223,50 277,140\" fill=\"none\" stroke=\"#4338ca\" stroke-width=\"2.6\"/>\n<text x=\"84\" y=\"156\" font-size=\"10\" fill=\"#475569\">2</text>\n<text x=\"138\" y=\"156\" font-size=\"10\" fill=\"#475569\">4</text>\n<text x=\"219\" y=\"156\" font-size=\"10\" fill=\"#475569\">7</text>\n<text x=\"16\" y=\"184\" font-size=\"10\" fill=\"#475569\">v₀</text>\n<text x=\"16\" y=\"104\" font-size=\"10\" fill=\"#475569\">v₁</text>\n<text x=\"16\" y=\"54\" font-size=\"10\" fill=\"#475569\">v₂</text>\n</svg><p>Um movimento é progressivo e retardado quando a velocidade é positiva e está diminuindo. O drone iniciou esse movimento no instante</p>","alternativas":{"a":"t = 0 s","b":"t = 2 s","c":"t = 4 s","d":"t = 7 s"},"explicacao":"Movimento progressivo e retardado ocorre quando a velocidade é positiva (v > 0) e decrescente. Isso acontece após t = 7 s, quando a velocidade, já no máximo v₂, começa a diminuir."},{"n":34,"skill":"Currículo SAS: para além da BNCC","correta":"a","enunciado":"<p>Um malabarista lançou uma bola verticalmente para cima com velocidade inicial de 5 m/s, e ela atingiu altura máxima de 1,25 m. Considere g = 10 m/s² e despreze a resistência do ar.</p><p>O tempo de subida da bola, em segundos, equivale a</p>","alternativas":{"a":"0,5","b":"1,0","c":"1,5","d":"2,0"},"explicacao":"Vale H/t = v/2, logo t = 2·H/v = (2·1,25)/5 = 0,5 s. (Também por v = v₀ − g·t, com v = 0: t = 5/10 = 0,5 s.)"},{"n":35,"skill":"Currículo SAS: para além da BNCC","correta":"b","enunciado":"<p>Uma pessoa, a partir do começo da Rua 1, caminhou 140 m em linha reta; virou à direita e caminhou 40 m; virou novamente à direita (sentido oposto ao trecho inicial) e caminhou 20 m; por fim, virou à esquerda e caminhou 10 m, chegando ao planetário.</p><svg viewBox=\"0 0 220 210\" width=\"220\" height=\"210\" style=\"max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\n<polygon points=\"50,185 50,45 160,185\" fill=\"#eff6ff\" stroke=\"#4338ca\" stroke-width=\"2\"/>\n<line x1=\"50\" y1=\"185\" x2=\"160\" y2=\"45\" stroke=\"#4338ca\" stroke-width=\"2.4\"/>\n<text x=\"20\" y=\"120\" font-size=\"11\" fill=\"#1e293b\">120 m</text>\n<text x=\"88\" y=\"200\" font-size=\"11\" fill=\"#1e293b\">50 m</text>\n<text x=\"112\" y=\"100\" font-size=\"12\" fill=\"#4338ca\" font-weight=\"700\">d</text>\n<rect x=\"50\" y=\"171\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1\"/>\n</svg><p>O módulo do vetor deslocamento, do ponto de partida até o planetário, é</p>","alternativas":{"a":"200 m","b":"130 m","c":"70 m","d":"30 m"},"explicacao":"Somando por direção: 140 − 20 = 120 m em um eixo; 40 + 10 = 50 m no eixo perpendicular. Por Pitágoras: d = √(120² + 50²) = √16 900 = 130 m."}]},{"nome":"Química","cor":"#ca8a04","questoes":[{"n":36,"skill":"EF09CI03","correta":"a","enunciado":"<p>A fluorescência é usada em tintas que absorvem luz ultravioleta e emitem luz visível, o que facilita identificar objetos em baixa luminosidade. Esse fenômeno pode ser explicado pelo modelo atômico de Bohr.</p><p>No fenômeno citado, a emissão de luz visível ocorre porque os</p>","alternativas":{"a":"elétrons excitados retornam a uma órbita mais interna (estacionária).","b":"elétrons absorvem energia ao saltarem para níveis mais internos.","c":"prótons liberam energia ao saltarem para níveis mais externos.","d":"prótons excitados alcançam níveis de energia mais elevados."},"explicacao":"Ao absorver energia, os elétrons saltam para níveis mais externos. Ao retornarem a órbitas mais internas (estacionárias), liberam o excesso de energia como fótons de luz visível. Prótons não participam desses saltos."},{"n":37,"skill":"Currículo SAS: para além da BNCC","correta":"d","enunciado":"<p>O selênio (Z = 34) é um elemento associado à proteção contra o estresse oxidativo. A configuração eletrônica desse elemento, em ordem crescente de energia, é</p>","alternativas":{"a":"1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 4p⁴ 3d¹⁰","b":"1s² 2s² 3s² 4s² 4p⁴ 2p⁶ 3p⁶ 3d¹⁰","c":"1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p⁴","d":"1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁴"},"explicacao":"Pelo diagrama de Linus Pauling, distribuindo os 34 elétrons em ordem crescente de energia: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁴ (o 4s² vem antes do 3d¹⁰)."},{"n":38,"skill":"Currículo SAS: para além da BNCC","correta":"d","enunciado":"<p>O escândio (Z = 21) é um elemento \"terra rara\", usado para aumentar a resistência de ligas de alumínio. Na tabela periódica, o escândio pertence a qual período?</p>","alternativas":{"a":"Primeiro","b":"Segundo","c":"Terceiro","d":"Quarto"},"explicacao":"A distribuição do escândio é 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹. O período corresponde à camada mais externa ocupada — a quarta (4s²). Logo, quarto período."},{"n":39,"skill":"Currículo SAS: para além da BNCC","correta":"b","enunciado":"<p>O enxofre (S) é essencial à vida, presente em aminoácidos e vitaminas. É um elemento não metálico cuja configuração na camada de valência é 3s² 3p⁴.</p><p>Na tabela periódica, o período e o grupo desse elemento são, respectivamente,</p>","alternativas":{"a":"2º período e grupo dos calcogênios.","b":"3º período e grupo dos calcogênios.","c":"2º período e grupo dos metais alcalinoterrosos.","d":"3º período e grupo dos metais alcalinoterrosos."},"explicacao":"A camada de valência termina no 3º nível (3º período). A soma dos elétrons de valência é 6 (2 + 4), característica do grupo 16, o grupo dos calcogênios."},{"n":40,"skill":"Currículo SAS: para além da BNCC","correta":"c","enunciado":"<p>O brometo de potássio (KBr) é formado por bromo (Z = 35) e potássio (Z = 19). O potássio, metal alcalino, tem baixa eletronegatividade; o bromo, halogênio, tem alta eletronegatividade.</p><p>De acordo com o tipo de ligação química predominante, a 25 °C e 1 atm, espera-se que, quando puro, ele apresente</p>","alternativas":{"a":"alta condutividade de corrente elétrica.","b":"baixa solubilidade em meios aquosos.","c":"elevada temperatura de ebulição.","d":"reduzida temperatura de fusão."},"explicacao":"A grande diferença de eletronegatividade gera transferência de elétrons e íons (K⁺ e Br⁻): ligação iônica. As fortes atrações entre os íons exigem muita energia para serem rompidas, conferindo elevadas temperaturas de fusão e ebulição."}]},{"nome":"Geografia","cor":"#ea580c","questoes":[{"n":41,"skill":"EF09GE11","correta":"d","enunciado":"<p>A Divisão Internacional do Trabalho (DIT) descreve como a produção, a comercialização e o consumo se distribuem entre as nações. Com a integração das economias, formaram-se áreas especializadas em tecnologia e capital e áreas voltadas ao fornecimento de matérias-primas, tornando as relações cada vez mais interligadas.</p><p>Com base no texto, a DIT está associada ao(à)</p>","alternativas":{"a":"retrocesso da industrialização.","b":"ocorrência de privatizações.","c":"superação da desigualdade entre países.","d":"avanço da globalização."},"explicacao":"A DIT organiza a economia mundial em países especializados em tecnologia/capital e outros em matérias-primas. Essa dinâmica se fortalece com a crescente integração entre as nações, associando-se ao avanço da globalização."},{"n":42,"skill":"EF09GE12","correta":"c","enunciado":"<p>Em 1960, cerca de 16% da população chinesa vivia em grandes cidades; em 2018, 59%. Esse crescimento começou na década de 1980, quando o governo abriu o país ao investimento estrangeiro e criou Zonas Econômicas Especiais (ZEEs), que atraíram muitos trabalhadores do campo.</p><p>Segundo o texto, a modernização da economia chinesa favoreceu</p>","alternativas":{"a":"um aumento massivo nas importações.","b":"a criação de empresas transnacionais.","c":"um processo acelerado de urbanização.","d":"a instalação de indústrias no espaço rural."},"explicacao":"O texto associa a modernização econômica e as ZEEs à migração de grande número de pessoas do campo para as cidades, o que caracteriza um processo acelerado de urbanização."},{"n":43,"skill":"EF09GE13","correta":"b","enunciado":"<p>A Revolução Verde consistiu na introdução de novas tecnologias na agropecuária (sementes selecionadas, fertilizantes, maquinário). No Brasil, viabilizou a agricultura de larga escala e, a partir dos anos 1990, ajudou o país a se tornar grande exportador de soja, café, açúcar, milho, algodão e suco de laranja.</p><p>As informações indicam que, no Brasil, a Revolução Verde contribuiu para a</p>","alternativas":{"a":"substituição de produtos transgênicos.","b":"ampliação da produtividade agrícola.","c":"ascensão dos pequenos produtores.","d":"preservação dos solos produtivos."},"explicacao":"A Revolução Verde introduziu tecnologias que aumentaram a produção agrícola brasileira, tornando o país grande exportador de alimentos — ou seja, ampliou a produtividade agrícola."},{"n":44,"skill":"EF09GE10","correta":"c","enunciado":"<p>O gráfico mostra a variação (%), entre 2015 e 2020, da fome no mundo e da produção de grãos no mundo e no Brasil. Em vários anos a produção cresceu; ainda assim, os índices de fome no mundo não caíram de forma correspondente.</p><svg viewBox=\"0 0 320 240\" width=\"320\" height=\"240\" style=\"max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"9\" fill=\"#475569\">\n<polygon points=\"14,14 8,21 20,21\" fill=\"#dc2626\"/><text x=\"24\" y=\"21\">Fome no mundo</text>\n<circle cx=\"150\" cy=\"18\" r=\"4\" fill=\"#2563eb\"/><text x=\"158\" y=\"21\">Grãos (mundo)</text>\n<rect x=\"244\" y=\"14\" width=\"8\" height=\"8\" fill=\"#16a34a\"/><text x=\"256\" y=\"21\">Grãos (Brasil)</text>\n</g>\n<line x1=\"42\" y1=\"190\" x2=\"272\" y2=\"190\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><text x=\"36\" y=\"193\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"end\">-15%</text><line x1=\"42\" y1=\"140\" x2=\"272\" y2=\"140\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><text x=\"36\" y=\"143\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"end\">0%</text><line x1=\"42\" y1=\"90\" x2=\"272\" y2=\"90\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><text x=\"36\" y=\"93\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"end\">15%</text><line x1=\"42\" y1=\"40\" x2=\"272\" y2=\"40\" stroke=\"#e2e8f0\" stroke-width=\"1\"/><text x=\"36\" y=\"43\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"end\">30%</text>\n<line x1=\"42\" y1=\"36\" x2=\"42\" y2=\"190\" stroke=\"#334155\" stroke-width=\"1.4\"/>\n<polyline points=\"42,156.66666666666669 88,53.333333333333336 134,96.66666666666666 180,120 226,113.33333333333333 272,90\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/><polyline points=\"42,143.33333333333331 88,130 134,143.33333333333331 180,136.66666666666669 226,136.66666666666669 272,126.66666666666666\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><polyline points=\"42,146.66666666666669 88,126.66666666666666 134,130 180,123.33333333333334 226,120 272,113.33333333333333\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n<rect x=\"38.5\" y=\"153.16666666666669\" width=\"7\" height=\"7\" fill=\"#16a34a\"/><rect x=\"84.5\" y=\"49.833333333333336\" width=\"7\" height=\"7\" fill=\"#16a34a\"/><rect x=\"130.5\" y=\"93.16666666666666\" width=\"7\" height=\"7\" fill=\"#16a34a\"/><rect x=\"176.5\" y=\"116.5\" width=\"7\" height=\"7\" fill=\"#16a34a\"/><rect x=\"222.5\" y=\"109.83333333333333\" width=\"7\" height=\"7\" fill=\"#16a34a\"/><rect x=\"268.5\" y=\"86.5\" width=\"7\" height=\"7\" fill=\"#16a34a\"/><circle cx=\"42\" cy=\"143.33333333333331\" r=\"3.5\" fill=\"#2563eb\"/><circle cx=\"88\" cy=\"130\" r=\"3.5\" fill=\"#2563eb\"/><circle cx=\"134\" cy=\"143.33333333333331\" r=\"3.5\" fill=\"#2563eb\"/><circle cx=\"180\" cy=\"136.66666666666669\" r=\"3.5\" fill=\"#2563eb\"/><circle cx=\"226\" cy=\"136.66666666666669\" r=\"3.5\" fill=\"#2563eb\"/><circle cx=\"272\" cy=\"126.66666666666666\" r=\"3.5\" fill=\"#2563eb\"/><polygon points=\"42,142.66666666666669 38,149.66666666666669 46,149.66666666666669\" fill=\"#dc2626\"/><polygon points=\"88,122.66666666666666 84,129.66666666666666 92,129.66666666666666\" fill=\"#dc2626\"/><polygon points=\"134,126 130,133 138,133\" fill=\"#dc2626\"/><polygon points=\"180,119.33333333333334 176,126.33333333333334 184,126.33333333333334\" fill=\"#dc2626\"/><polygon points=\"226,116 222,123 230,123\" fill=\"#dc2626\"/><polygon points=\"272,109.33333333333333 268,116.33333333333333 276,116.33333333333333\" fill=\"#dc2626\"/>\n<text x=\"42\" y=\"204\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">2015</text><text x=\"88\" y=\"204\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">2016</text><text x=\"134\" y=\"204\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">2017</text><text x=\"180\" y=\"204\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">2018</text><text x=\"226\" y=\"204\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">2019</text><text x=\"272\" y=\"204\" font-size=\"9\" fill=\"#64748b\" text-anchor=\"middle\">2020</text>\n</svg><p>Os dados indicam que</p>","alternativas":{"a":"a subnutrição é consequência da queda da produtividade agrícola.","b":"a expansão das áreas cultiváveis resolve, sozinha, a escassez de alimentos.","c":"o aumento da produção agrícola não garante uma distribuição alimentar equitativa.","d":"o crescimento da agricultura brasileira prejudica a economia de outros países."},"explicacao":"Mesmo com o aumento da produção de grãos, a fome no mundo não diminuiu proporcionalmente. Isso mostra que produzir mais não basta: a fome envolve distribuição, desigualdades, conflitos e desperdício."},{"n":45,"skill":"EF09GE10","correta":"a","enunciado":"<p>A Nova Divisão Internacional do Trabalho baseia-se na transferência, dos países centrais para os periféricos, de segmentos industriais que empregam trabalho intensivo, além de setores que usam tecnologias mais antigas.</p><p>Nesse contexto, um fator que torna os países periféricos atrativos para a instalação de fábricas é a</p>","alternativas":{"a":"presença de mão de obra mais barata, o que reduz os custos de produção.","b":"ausência de leis ambientais, o que preserva os recursos naturais.","c":"grande disponibilidade de profissionais altamente qualificados.","d":"elevada eficiência dos sistemas de transporte."},"explicacao":"Nesses países, as leis trabalhistas costumam ser menos rigorosas e há menos mão de obra qualificada, o que resulta em salários mais baixos. Essa mão de obra mais barata reduz custos e atrai a instalação de fábricas."}]},{"nome":"História","cor":"#7c3aed","questoes":[{"n":46,"skill":"EF09HI11","correta":"c","enunciado":"<p>Ao retornar do exílio em 1917, Lênin, principal líder bolchevique, foi recebido em Petrogrado por uma multidão. Em discursos marcantes, criticava o governo provisório e defendia que o povo precisava de paz, pão e terra, conclamando os trabalhadores a lutar por uma revolução que instaurasse um governo dos sovietes.</p><p>No contexto da Revolução Russa, o discurso de Lênin foi proferido em defesa da</p>","alternativas":{"a":"anistia dos presos políticos.","b":"redução das intervenções estatais.","c":"instalação de um governo socialista.","d":"retomada da monarquia constitucional."},"explicacao":"Ao criticar o governo provisório e conclamar os trabalhadores à revolução a partir dos sovietes, Lênin defendia a instauração de um governo de cunho socialista — o primeiro da história."},{"n":47,"skill":"EF09HI13","correta":"b","enunciado":"<p>Durante o regime nazista, os guetos eram áreas urbanas cercadas nas quais a população judaica era concentrada e forçada a viver em condições miseráveis, isolada das demais comunidades e com direitos básicos restringidos.</p><p>As informações indicam que o nazismo alemão foi marcado pela</p>","alternativas":{"a":"censura dos meios de comunicação.","b":"adoção de políticas antissemitas.","c":"defesa do militarismo na sociedade.","d":"perseguição aos movimentos sindicais."},"explicacao":"A criação de guetos para segregar e confinar a população judaica é um exemplo das práticas antissemitas do regime nazista."},{"n":48,"skill":"EF09HI15","correta":"c","enunciado":"<p>A Carta das Nações Unidas, documento criado em 1945, expressa o compromisso dos povos em praticar a tolerância, viver em paz como bons vizinhos e unir esforços para manter a segurança internacional, promovendo o progresso econômico e social de todos.</p><p>O trecho evidencia uma intenção conjunta de</p>","alternativas":{"a":"ignorar as rivalidades de caráter religioso.","b":"criar uma agência de regulação comercial.","c":"promover uma boa relação entre os países.","d":"fortalecer o potencial bélico dos territórios."},"explicacao":"A ONU foi criada ao final da Segunda Guerra com o objetivo de promover a paz. Ao falar em praticar a tolerância e viver em paz uns com os outros, o trecho evidencia a intenção de promover uma boa relação entre os países."},{"n":49,"skill":"EF09HI02","correta":"b","enunciado":"<p>Durante o Estado Novo (1937–1945), o governo de Getúlio Vargas usou intensamente a propaganda política. O Departamento de Imprensa e Propaganda (DIP) produzia cartazes e mensagens que exaltavam o presidente e estimulavam homenagens a ele, ao mesmo tempo em que censurava informações.</p><p>Nesse contexto, a propaganda do Estado Novo era utilizada como recurso de</p>","alternativas":{"a":"exclusão de todas as narrativas políticas do país.","b":"formação de opinião pública favorável ao governo.","c":"conscientização do povo sobre problemas sociais.","d":"divulgação dos valores do sistema democrático."},"explicacao":"O DIP atuava na censura e na propaganda, promovendo a imagem de Vargas como líder benéfico. Essas estratégias visavam formar uma opinião pública favorável ao governo e manter sua estabilidade."},{"n":50,"skill":"EF09HI17","correta":"a","enunciado":"<p>O projeto de modernização do governo de Juscelino Kubitschek (JK) defendia maior integração entre indústria e agropecuária e a modernização da agricultura, mas manteve a grande propriedade rural. No campo, isso preservou a concentração de terras, da qual a maioria da população rural permanecia excluída.</p><p>O texto indica que esse processo contribuiu para o(a)</p>","alternativas":{"a":"fortalecimento das desigualdades sociais.","b":"desapropriação dos latifúndios agrícolas.","c":"encerramento da política oligárquica.","d":"estatização dos complexos industriais."},"explicacao":"Ao modernizar a agricultura mantendo a grande propriedade e excluindo a maioria da população do campo, o projeto de JK reforçou a concentração de terras e, com isso, fortaleceu as desigualdades sociais."}]},{"nome":"Filosofia","cor":"#0891b2","questoes":[{"n":51,"skill":"Currículo SAS: para além da BNCC","correta":"d","enunciado":"<p>A água é um elemento natural fundamental para a vida: nasce em fontes, corre nos rios, banha aldeias e mata a sede das populações. Na Antiguidade, esse elemento teve destaque no pensamento do filósofo Tales de Mileto (624–548 a.C.).</p><p>Para Tales, a água era tratada como</p>","alternativas":{"a":"uma substância sacralizada pelo monoteísmo.","b":"a reunião de diferentes moléculas químicas.","c":"um fundamento da mitologia greco-romana.","d":"o princípio originário de todas as coisas."},"explicacao":"Para Tales de Mileto, todas as coisas derivavam de um único princípio originário, presente em tudo e em permanente transformação: a água. Ele a compreendia como a arché, a origem de todas as coisas."},{"n":52,"skill":"Currículo SAS: para além da BNCC","correta":"b","enunciado":"<p>O filósofo Aristóteles defendia que alguns seres humanos nasceriam para obedecer e outros para mandar, apresentando o escravo como propriedade do senhor. Essa concepção procurava justificar e naturalizar a exclusão de determinados grupos.</p><p>Essa descrição está diretamente ligada a qual problema presente na democracia ateniense?</p>","alternativas":{"a":"Perseguição aos abolicionistas.","b":"Naturalização do escravismo.","c":"Discriminação de gênero.","d":"Preconceito racial."},"explicacao":"Aristóteles propunha que alguns nasceriam para servir, tratando o escravo como propriedade — o que buscava naturalizar o escravismo. Na democracia ateniense, os escravizados não tinham direitos nem participação política."},{"n":53,"skill":"Currículo SAS: para além da BNCC","correta":"b","enunciado":"<p>Os sofistas eram conhecidos por sua habilidade retórica e persuasiva. Na Atenas democrática, dominar a palavra significava influenciar a assembleia e conquistar poder político. Muitas vezes, priorizavam a forma dos discursos em detrimento do conteúdo.</p><p>Os sofistas foram criticados por Sócrates por</p>","alternativas":{"a":"pensarem o mundo a partir de uma dualidade entre corpo e alma.","b":"valorizarem mais a forma do que o conteúdo nos debates públicos.","c":"atribuírem inspiração divina às ideias da sociedade.","d":"buscarem o fundamento que deu origem a todas as coisas naturais."},"explicacao":"Os sofistas concentravam-se na arte de bem argumentar e persuadir, muitas vezes priorizando a forma em vez do conteúdo. Sócrates criticava essa postura, defendendo a busca pela verdade e a reflexão ética."},{"n":54,"skill":"Currículo SAS: para além da BNCC","correta":"c","enunciado":"<p>A dialética socrática se apresenta por meio de diálogos. De forma provocante, Sócrates fazia perguntas para despertar no interlocutor a busca por uma verdade que não estava pronta no discurso, mas que surgia do autoquestionamento e do uso cuidadoso da razão.</p><p>O texto indica que, na filosofia de Sócrates, o diálogo era considerado um meio para</p>","alternativas":{"a":"levar os sujeitos a reconhecerem a própria felicidade.","b":"desenvolver a beleza das palavras nas argumentações.","c":"fazer os indivíduos buscarem conhecer a verdade.","d":"reforçar a superioridade intelectual de algumas pessoas."},"explicacao":"Em vez de transmitir o que julgava verdadeiro, Sócrates usava perguntas para conduzir as pessoas a questionar suas crenças. Assim, o diálogo era um meio para levar os indivíduos a buscar o conhecimento da verdade."},{"n":55,"skill":"Currículo SAS: para além da BNCC","correta":"c","enunciado":"<p>Platão defendia que a pólis deveria ser governada por aqueles que possuíssem mais sabedoria e capacidade de liderança. Para ilustrar, comparava a situação à de um doente que procura um médico e à de quem precisa de orientação e busca alguém capaz de comandar.</p><p>Platão utiliza esses exemplos para mostrar que, para ele, deveriam governar a pólis os indivíduos que</p>","alternativas":{"a":"combatiam a influência da elite.","b":"detinham maior força física.","c":"possuíam mais sabedoria.","d":"apenas ouviam a comunidade."},"explicacao":"Para Platão, o critério de governo não era a riqueza nem a força, mas a sabedoria. Assim como o doente procura um médico competente, a pólis deveria ser conduzida por indivíduos sábios e preparados para governar."}]},{"nome":"Arte","cor":"#db2777","questoes":[{"n":56,"skill":"EF69AR01","correta":"c","enunciado":"<p>O artista e designer gráfico catarinense Marcelo Monreal, na série <em>Faces [UN]bonded</em>, cria obras surrealistas em que combina retratos de celebridades com elementos florais que parecem brotar de dentro dos rostos. Essa criação pode ser compreendida como uma fotomontagem pelo fato de</p>","alternativas":{"a":"sobrepor objetos tridimensionais em uma superfície.","b":"retratar uma pintura botânica desvinculada do realismo.","c":"produzir uma imagem a partir de fragmentos de imagens distintas.","d":"acrescentar elementos a uma fotografia com o intuito de gerar humor."},"explicacao":"A fotomontagem associa fragmentos de diferentes imagens para formar uma nova composição visual. Monreal combina retratos e elementos florais, criando uma imagem construída a partir de fragmentos de imagens distintas."},{"n":57,"skill":"EF69AR05","correta":"d","enunciado":"<p>No final da década de 1960, o artista norte-americano Dennis Oppenheim realizou <em>Annual Rings</em> na fronteira congelada entre Estados Unidos e Canadá. Ele desenhou anéis concêntricos sobre o gelo, atravessando a linha de fronteira e chamando a atenção para o caráter arbitrário da divisão do tempo (o fuso horário) imposta entre os dois lados.</p><p>Entre os gêneros da performance, <em>Annual Rings</em> é um exemplo de arte conceitual porque</p>","alternativas":{"a":"utiliza pouquíssimos elementos em sua criação.","b":"associa vida e arte a partir da cultura de massa.","c":"estabelece uma conexão com modalidades cênicas e musicais.","d":"atribui maior relevância às ideias expressas do que à apresentação estética."},"explicacao":"A arte conceitual valoriza mais as ideias do que a estética tradicional. Annual Rings propõe uma reflexão sobre fronteiras e convenções humanas (o fuso horário), dando maior importância ao conceito do que à aparência."},{"n":58,"skill":"EF69AR09","correta":"c","enunciado":"<p>Rudolf Laban descreveu, para a dança, os níveis (ou planos) alto, médio e baixo, definidos pela concentração dos movimentos: no baixo, o corpo se movimenta próximo ao chão; no médio, entre o quadril e os ombros; no alto, acima dos ombros. Em certa apresentação, uma bailarina executa um movimento com as pernas apoiadas no solo e o tronco debruçado para a frente, aproximando-se ainda mais do chão.</p><p>De acordo com os níveis descritos, a bailarina dança no plano</p>","alternativas":{"a":"alto, posicionando os braços acima do corpo.","b":"alto, mantendo os movimentos entre o quadril e os ombros.","c":"baixo, já que o corpo fica bem próximo ao chão.","d":"médio, pois focaliza o movimento acima dos ombros."},"explicacao":"No nível baixo, os movimentos se concentram próximos ao chão. Como a bailarina está com as pernas no solo e o tronco debruçado, aproximando-se ainda mais do chão, ela dança no plano baixo."},{"n":59,"skill":"EF69AR17","correta":"c","enunciado":"<p>Compare dois espaços de apresentação musical: o palco popular, montado em grandes festivais ao ar livre para um vasto público, e a sala de concerto, projetada especialmente para orquestras e conjuntos menores.</p><p>A diferença entre esses dois tipos de espaço consiste no fato de que</p>","alternativas":{"a":"o palco popular recebe apenas apresentações eruditas, e a sala de concerto, apenas as populares.","b":"a sala de concerto se destina a apresentações não musicais, e o palco popular, a musicais.","c":"o palco popular costuma exigir amplificação de som, enquanto a sala de concerto é projetada com acústica que dispensa essa amplificação.","d":"a sala de concerto requer instrumentos de amplificação de imagem, e o palco popular, apenas de som."},"explicacao":"A sala de concerto tem acústica que distribui bem o som, permitindo ouvir com qualidade sem amplificação. Já o palco popular, voltado a grandes públicos, geralmente exige amplificadores para alcançar toda a plateia."},{"n":60,"skill":"EF69AR17","correta":"d","enunciado":"<p>O fonógrafo, inventado em 1877, permitiu registrar e reproduzir sons. Com ele, a música pôde ser gravada e ouvida sem a presença dos músicos no momento da execução, o que transformou a realidade sociocultural da música e impulsionou o mercado fonográfico.</p><p>Segundo o texto, a invenção mencionada possibilitou diretamente a</p>","alternativas":{"a":"amplificação de sons em palcos, aprimorando a acústica.","b":"divulgação do trabalho de músicos por meio de partituras impressas.","c":"transmissão de rádio, feita por ondas eletromagnéticas.","d":"reprodução de sons gravados, colaborando para o desenvolvimento da indústria musical."},"explicacao":"O fonógrafo permitiu gravar e reproduzir sons de forma assíncrona, sem a presença do público na execução. Isso impulsionou a indústria fonográfica, abrindo caminho para a produção em massa e a comercialização de gravações."}]}];
var estado = {};            // n -> letra escolhida
var ativa = 0;             // índice da matéria ativa
var TOTAL = 60;
var painel = document.getElementById('painel');
var tabs = document.getElementById('tabs');

function corDe(i){ return MATERIAS[i].cor; }

function montarTabs(){
  tabs.innerHTML='';
  MATERIAS.forEach(function(m,i){
    var b=document.createElement('button');
    b.innerHTML='<span class="dot" style="background:'+m.cor+'"></span>'+m.nome+'<span class="done" id="done'+i+'"></span>';
    if(i===ativa){b.className='active';b.style.background=m.cor;}
    b.onclick=function(){ativa=i;render();};
    tabs.appendChild(b);
  });
}

function atualizarTabDone(){
  MATERIAS.forEach(function(m,i){
    var el=document.getElementById('done'+i);
    if(!el)return;
    var resp=m.questoes.filter(function(q){return estado[q.n]!==undefined;}).length;
    el.textContent=resp+'/'+m.questoes.length;
  });
}

function render(){
  document.documentElement.style.setProperty('--accent',corDe(ativa));
  montarTabs();
  var m=MATERIAS[ativa];
  painel.innerHTML='';
  m.questoes.forEach(function(q){ painel.appendChild(cardQuestao(q)); });
  var s=document.createElement('div'); s.className='summary'; s.id='sum'; painel.appendChild(s);
  atualizarResumoMateria();
  atualizarTabDone();
  window.scrollTo({top:0,behavior:'smooth'});
}

function cardQuestao(q){
  var card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  var head=document.createElement('div'); head.className='qhead';
  head.innerHTML='<span class="qnum">Questão '+q.n+'</span><span class="skill" title="'+q.skill+'">'+q.skill+'</span>';
  card.appendChild(head);
  var stem=document.createElement('div'); stem.className='stem'; stem.innerHTML=q.enunciado; card.appendChild(stem);
  var ul=document.createElement('ul'); ul.className='opts';
  ['a','b','c','d'].forEach(function(k){
    var li=document.createElement('li'); li.className='opt'; li.dataset.k=k; li.id='q'+q.n+'-'+k;
    li.innerHTML='<span class="key">'+k.toUpperCase()+'</span><span class="txt">'+q.alternativas[k]+'</span>';
    li.onclick=function(){responder(q,k);};
    ul.appendChild(li);
  });
  card.appendChild(ul);
  var ex=document.createElement('div'); ex.className='expl'; ex.id='ex'+q.n; card.appendChild(ex);
  if(estado[q.n]!==undefined) aplicarResposta(q,estado[q.n],true);
  return card;
}

function responder(q,k){
  if(estado[q.n]!==undefined) return; // trava após responder
  estado[q.n]=k;
  aplicarResposta(q,k,false);
  atualizarPlacar();
  atualizarResumoMateria();
  atualizarTabDone();
}

function aplicarResposta(q,k,silent){
  var acertou=(k===q.correta);
  ['a','b','c','d'].forEach(function(o){
    var li=document.getElementById('q'+q.n+'-'+o);
    if(!li)return;
    li.classList.add('locked');
    if(o===q.correta) li.classList.add('correct');
    else if(o===k) li.classList.add('wrong');
    else li.classList.add('dim');
  });
  var ex=document.getElementById('ex'+q.n);
  if(ex){
    ex.className='expl show '+(acertou?'right':'rong');
    ex.innerHTML='<div class="tag">'+(acertou?'✓ Você acertou':'✗ Resposta correta: '+q.correta.toUpperCase())+'</div>'+q.explicacao;
  }
}

function atualizarPlacar(){
  var resp=Object.keys(estado).length, ac=0;
  MATERIAS.forEach(function(m){m.questoes.forEach(function(q){ if(estado[q.n]===q.correta) ac++; });});
  document.getElementById('resp').textContent=resp;
  document.getElementById('acertos').textContent=ac;
  document.getElementById('pct').textContent = resp? Math.round(ac/resp*100)+'%' : '—';
  document.getElementById('bar').style.width=(resp/TOTAL*100)+'%';
}

function atualizarResumoMateria(){
  var m=MATERIAS[ativa], s=document.getElementById('sum'); if(!s)return;
  var qs=m.questoes, resp=qs.filter(function(q){return estado[q.n]!==undefined;});
  var ac=qs.filter(function(q){return estado[q.n]===q.correta;}).length;
  if(resp.length===qs.length){
    s.className='summary show';
    s.innerHTML='<h3>'+m.nome+' — matéria concluída!</h3><p>Você acertou <span class="big">'+ac+' de '+qs.length+'</span> questões desta matéria.</p>';
  } else {
    s.className='summary';
  }
}

document.getElementById('restart').onclick=function(){
  estado={}; atualizarPlacar(); render();
};

atualizarPlacar();
render();
</script>
