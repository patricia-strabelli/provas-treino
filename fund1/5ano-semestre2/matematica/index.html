<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2ª Prova Treino · 5º ano · Matemática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f7; --card:#ffffff; --ink:#1e293b; --muted:#64748b;
    --line:#e2e8f0; --ok:#16a34a; --okbg:#dcfce7; --no:#dc2626; --nobg:#fee2e2;
    --accent:#2563eb;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Public Sans',system-ui,sans-serif; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px; margin:0 auto; padding:16px 14px 60px}
  h1,h2,h3,.tab,.qnum{font-family:'Bricolage Grotesque','Public Sans',sans-serif}
  .num{font-family:'Space Mono',monospace}

  /* Header */
  header{
    background:linear-gradient(135deg,#1d4ed8,#0ea5e9);
    color:#fff; border-radius:18px; padding:22px 20px; margin-bottom:14px;
    box-shadow:0 8px 24px rgba(29,78,216,.18);
  }
  header h1{margin:0; font-size:1.7rem; font-weight:800; letter-spacing:-.5px}
  header p{margin:4px 0 0; opacity:.92; font-size:.98rem; font-weight:500}

  /* Stats */
  .stats{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:14px;
  }
  .stat{display:flex; align-items:baseline; gap:6px; font-size:.92rem; color:var(--muted); font-weight:600}
  .stat b{font-family:'Space Mono',monospace; font-size:1.15rem; color:var(--ink)}
  .bar{flex:1 1 160px; height:10px; background:var(--line); border-radius:20px; overflow:hidden; min-width:130px}
  .bar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,#22c55e,#16a34a); transition:width .4s}
  .restart{
    margin-left:auto; border:0; cursor:pointer; font-weight:700; font-family:'Public Sans';
    background:#f1f5f9; color:#334155; padding:9px 16px; border-radius:10px; font-size:.9rem;
  }
  .restart:hover{background:#e2e8f0}

  /* Tabs */
  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
  .tab{
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    padding:9px 15px; border-radius:11px; cursor:pointer; font-weight:700; font-size:.92rem;
    display:flex; align-items:center; gap:8px; transition:.15s;
  }
  .tab .dot{width:11px; height:11px; border-radius:50%; background:var(--tabc)}
  .tab.active{color:#fff; background:var(--tabc); border-color:var(--tabc); box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .tab.active .dot{background:#fff}

  /* Question card */
  .card{
    background:var(--card); border:1px solid var(--line); border-left:5px solid var(--accent);
    border-radius:14px; padding:18px 18px 16px; margin-bottom:14px;
  }
  .qhead{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap}
  .qnum{
    font-weight:800; font-size:.95rem; color:#fff; background:var(--accent);
    width:34px; height:34px; border-radius:9px; display:grid; place-items:center; flex:none;
    font-family:'Space Mono',monospace;
  }
  .skill{
    font-size:.72rem; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
    color:var(--muted); background:#f1f5f9; padding:4px 9px; border-radius:20px;
  }
  .stem{font-size:1.03rem; margin:2px 0 12px}
  .media{margin:8px 0 14px; text-align:center}
  .media svg{max-width:100%; height:auto}
  table.data{border-collapse:collapse; margin:6px auto; font-size:.95rem}
  table.data th,table.data td{border:1px solid #cbd5e1; padding:6px 14px; text-align:center}
  table.data th{background:#f1f5f9; font-weight:700; font-family:'Public Sans'}
  table.data td.k{font-weight:600; background:#f8fafc}

  /* Options */
  .opts{display:flex; flex-direction:column; gap:9px}
  .opt{
    display:flex; align-items:center; gap:12px; text-align:left; width:100%;
    border:1.5px solid var(--line); background:#fff; color:var(--ink);
    padding:11px 13px; border-radius:11px; cursor:pointer; font-size:1rem;
    font-family:'Public Sans'; transition:.12s;
  }
  .opt:hover:not(:disabled){border-color:var(--accent); background:#f8faff}
  .opt:disabled{cursor:default}
  .opt .lt{
    font-family:'Space Mono',monospace; font-weight:700; flex:none;
    width:28px; height:28px; border-radius:7px; display:grid; place-items:center;
    background:#f1f5f9; color:#475569; font-size:.9rem;
  }
  .opt.correct{border-color:var(--ok); background:var(--okbg)}
  .opt.correct .lt{background:var(--ok); color:#fff}
  .opt.wrong{border-color:var(--no); background:var(--nobg)}
  .opt.wrong .lt{background:var(--no); color:#fff}
  .opt .svgopt svg{width:112px; height:auto}

  .explain{
    margin-top:12px; border-radius:10px; padding:11px 13px; font-size:.95rem;
    display:none; border:1px solid transparent;
  }
  .explain.show{display:block}
  .explain.r{background:var(--okbg); border-color:#bbf7d0; color:#14532d}
  .explain.w{background:#fff7ed; border-color:#fed7aa; color:#7c2d12}
  .explain b{font-family:'Bricolage Grotesque'}

  /* Fractions */
  .frac{display:inline-flex; flex-direction:column; text-align:center; vertical-align:middle;
    font-family:'Space Mono',monospace; line-height:1; margin:0 2px; transform:translateY(-1px)}
  .frac .n{border-bottom:1.6px solid currentColor; padding:0 3px}
  .frac .d{padding:1px 3px 0}

  /* Per-tab summary */
  .summary{
    background:linear-gradient(135deg,#f0fdf4,#ecfeff); border:1px solid #bbf7d0;
    border-radius:14px; padding:18px; text-align:center; margin-bottom:14px; display:none;
  }
  .summary.show{display:block}
  .summary h3{margin:0 0 6px; font-size:1.2rem}
  .summary .big{font-family:'Space Mono',monospace; font-size:2.1rem; font-weight:700; color:#16a34a}
  .summary p{margin:6px 0 0; color:var(--muted); font-size:.95rem}
  .foot{text-align:center; color:var(--muted); font-size:.82rem; margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2ª Prova Treino</h1>
    <p>5º ano · Ensino Fundamental — Matemática</p>
  </header>

  <div class="stats">
    <div class="stat">Respondidas <b><span id="ans">0</span>/<span id="total">0</span></b></div>
    <div class="stat">Acertos <b id="hits">0</b></div>
    <div class="bar"><i id="fill"></i></div>
    <button class="restart" id="restart">↻ Recomeçar</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="summary" class="summary"></div>
  <div id="quiz"></div>

  <div class="foot">Prova Treino · modo prática, sem nota · as respostas foram resolvidas a partir do currículo SAS.</div>
</div>

<script>
/* ---------- helpers ---------- */
function mf(t){
  if(t==null) return '';
  t = String(t);
  // mixed number {a b/c}
  t = t.replace(/\{(\d+)\s+(\d+)\/(\d+)\}/g,(m,i,n,d)=>
     `${i}<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`);
  // fraction {a/b}
  t = t.replace(/\{(\d+)\/(\d+)\}/g,(m,n,d)=>
     `<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`);
  return t;
}

/* number line: min,max, divisions, points [{x,label}] */
function numLine(min,max,divs,points){
  const W=560,H=96,pad=44,y=48,len=W-2*pad,scale=len/(max-min),step=(max-min)/divs;
  let s=`<line x1="${pad}" y1="${y}" x2="${W-pad+14}" y2="${y}" stroke="#334155" stroke-width="2"/>`;
  s+=`<polygon points="${W-pad+14},${y} ${W-pad+6},${y-5} ${W-pad+6},${y+5}" fill="#334155"/>`;
  for(let i=0;i<=divs;i++){
    const v=min+i*step, px=pad+(v-min)*scale, major=Math.abs(v-Math.round(v))<1e-9;
    s+=`<line x1="${px.toFixed(1)}" y1="${y-(major?11:6)}" x2="${px.toFixed(1)}" y2="${y+(major?11:6)}" stroke="#334155" stroke-width="${major?2:1}"/>`;
    if(major) s+=`<text x="${px.toFixed(1)}" y="${y-16}" font-size="14" text-anchor="middle" font-family="Space Mono,monospace" fill="#334155">${Math.round(v)}</text>`;
  }
  points.forEach(p=>{
    const px=pad+(p.x-min)*scale;
    s+=`<circle cx="${px.toFixed(1)}" cy="${y}" r="5.5" fill="#dc2626"/>`;
    s+=`<text x="${px.toFixed(1)}" y="${y+30}" font-size="16" text-anchor="middle" font-family="Space Mono,monospace" font-weight="700" fill="#dc2626">${p.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img">${s}</svg>`;
}

/* grid with a shaded rect or right-triangle. cols,rows,shaded x,y,w,h */
function grid(cols,rows,sx,sy,sw,sh,shape){
  const c=15,pad=7,W=cols*c+2*pad,H=rows*c+2*pad;
  let s='';
  for(let i=0;i<=cols;i++) s+=`<line x1="${pad+i*c}" y1="${pad}" x2="${pad+i*c}" y2="${pad+rows*c}" stroke="#cbd5e1" stroke-width="1"/>`;
  for(let j=0;j<=rows;j++) s+=`<line x1="${pad}" y1="${pad+j*c}" x2="${pad+cols*c}" y2="${pad+j*c}" stroke="#cbd5e1" stroke-width="1"/>`;
  const X=pad+sx*c,Y=pad+sy*c;
  if(shape==='tri'){
    s+=`<polygon points="${X},${Y} ${X},${Y+sh*c} ${X+sw*c},${Y+sh*c}" fill="#94a3b8" stroke="#334155" stroke-width="2.2"/>`;
  }else{
    s+=`<rect x="${X}" y="${Y}" width="${sw*c}" height="${sh*c}" fill="#94a3b8" stroke="#334155" stroke-width="2.2"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img">${s}</svg>`;
}

/* pie split into "total" equal sectors, first "shaded" filled */
function pie(total,shaded){
  const cx=72,cy=72,r=62; let s='';
  for(let i=0;i<total;i++){
    const a0=(i/total)*2*Math.PI-Math.PI/2, a1=((i+1)/total)*2*Math.PI-Math.PI/2;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    s+=`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${i<shaded?'#94a3b8':'#f8fafc'}" stroke="#334155" stroke-width="1.6"/>`;
  }
  return `<svg viewBox="0 0 144 144" width="150" height="150" xmlns="http://www.w3.org/2000/svg" role="img">${s}</svg>`;
}

/* regular hexagon */
function hexagon(){
  const cx=80,cy=74,r=60; let p=[];
  for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-90); p.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`);}
  return `<svg viewBox="0 0 160 148" width="170" xmlns="http://www.w3.org/2000/svg" role="img"><polygon points="${p.join(' ')}" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/></svg>`;
}

/* hexagon divided into 12 equal triangles */
function hex12(){
  const cx=80,cy=74,R=60; let pts=[];
  for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-90); pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]);}
  const mid=[]; for(let i=0;i<6;i++){const A=pts[i],B=pts[(i+1)%6]; mid.push([(A[0]+B[0])/2,(A[1]+B[1])/2]);}
  // ring order: v0,m0,v1,m1,...  → 12 boundary points, 12 triangles to center
  const ring=[]; for(let i=0;i<6;i++){ring.push(pts[i]); ring.push(mid[i]);}
  let s='';
  for(let i=0;i<12;i++){
    const A=ring[i],B=ring[(i+1)%12];
    s+=`<polygon points="${cx},${cy} ${A[0].toFixed(1)},${A[1].toFixed(1)} ${B[0].toFixed(1)},${B[1].toFixed(1)}" fill="${i%2?'#94a3b8':'#cbd5e1'}" stroke="#334155" stroke-width="1.6"/>`;
  }
  return `<svg viewBox="0 0 160 148" width="180" xmlns="http://www.w3.org/2000/svg" role="img">${s}</svg>`;
}

/* four triangle pieces: acute, right, acute-iso, obtuse */
function fourTriangles(){
  const y0=110,h=80; let s='';
  const label=(x,t)=>`<text x="${x}" y="128" font-size="13" text-anchor="middle" font-family="Public Sans" fill="#475569">${t}</text>`;
  // Peça 1: acutângulo (quase equilátero)
  s+=`<polygon points="40,${y0} 100,${y0} 70,${y0-h}" fill="#94a3b8" stroke="#334155" stroke-width="2"/>`+label(70,'Peça 1');
  // Peça 2: retângulo (marca de ângulo reto no canto inf. esq.)
  s+=`<polygon points="150,${y0} 210,${y0} 150,${y0-h}" fill="#94a3b8" stroke="#334155" stroke-width="2"/>`
    +`<path d="M150,${y0-12} L162,${y0-12} L162,${y0}" fill="none" stroke="#1e293b" stroke-width="1.5"/>`+label(178,'Peça 2');
  // Peça 3: acutângulo isósceles alto
  s+=`<polygon points="260,${y0} 320,${y0} 290,${y0-h}" fill="#94a3b8" stroke="#334155" stroke-width="2"/>`+label(290,'Peça 3');
  // Peça 4: obtusângulo (ápice deslocado bem para a esquerda)
  s+=`<polygon points="370,${y0} 470,${y0} 372,${y0-52}" fill="#94a3b8" stroke="#334155" stroke-width="2"/>`+label(420,'Peça 4');
  return `<svg viewBox="0 0 500 138" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">${s}</svg>`;
}

/* esquadro: right triangle with right-angle mark */
function esquadro(){
  const s=`<polygon points="30,120 250,120 30,20" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>`
    +`<path d="M30,104 L46,104 L46,120" fill="none" stroke="#1e293b" stroke-width="2"/>`;
  return `<svg viewBox="0 0 270 140" width="260" xmlns="http://www.w3.org/2000/svg" role="img">${s}</svg>`;
}

/* small table builder */
function tbl(head,rows){
  let h=`<tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr>`;
  let b=rows.map(r=>`<tr><td class="k">${r[0]}</td><td>${r[1]}</td></tr>`).join('');
  return `<table class="data">${h}${b}</table>`;
}

/* ---------- data (48 questions, 4 thematic tabs) ---------- */
const TABS=[
{name:"Números e Operações", color:"#2563eb", questions:[
 {stem:"Beatriz gastou R$ 56,50 em uma livraria e pagou o valor exato, sem receber troco. Qual conjunto de cédulas e moedas ela pode ter usado?",
  opts:["Uma cédula de R$ 50, uma de R$ 5, uma moeda de R$ 1 e uma moeda de R$ 0,50","Uma cédula de R$ 50, uma de R$ 5 e uma moeda de R$ 0,50","Uma cédula de R$ 50, uma de R$ 5 e uma moeda de R$ 1","Uma cédula de R$ 50, uma de R$ 5 e duas moedas de R$ 1"],
  a:0, e:"50 + 5 + 1 + 0,50 = 56,50. As demais somam 55,50, 56,00 e 57,00."},
 {stem:"Manuela comprou um controle de videogame por R$ 69,00 e pagou o valor exato, sem sobrar troco. Quais cédulas ela pode ter usado?",
  opts:["Uma cédula de R$ 50, uma de R$ 10, uma de R$ 5 e duas de R$ 2","Uma cédula de R$ 50 e uma de R$ 10","Três cédulas de R$ 20 e uma de R$ 5","Uma cédula de R$ 50, uma de R$ 10 e uma de R$ 5"],
  a:0, e:"50 + 10 + 5 + 2 + 2 = 69. As demais somam 60, 65 e 65."},
 {stem:"Roberto comprou toalhas por R$ 370,00 e chapéus por R$ 120,00. Pagou com duas cédulas de R$ 200,00 e uma de R$ 100,00. Quanto recebeu de troco?",
  opts:["R$ 10,00","R$ 90,00","R$ 110,00","R$ 190,00"],

 {stem:"Laura comprou um vestido por R$ 295,00 e sapatos por R$ 120,00. Pagou com duas notas de R$ 200,00 e uma de R$ 50,00. Quanto recebeu de troco?",
  opts:["R$ 15,00","R$ 25,00","R$ 35,00","R$ 45,00"],
  a:2, e:"Total: 295 + 120 = 415. Pagou 450. Troco: 450 − 415 = 35."},
 {stem:"Eloá pagou R$ 200,00 de entrada e mais 11 parcelas de R$ 250,00 por um pacote de viagem. Quanto custou o pacote?",

 {stem:"Antônio deu R$ 350,00 de entrada e dividiu o restante em 12 parcelas de R$ 190,00 por uma geladeira. Quanto pagará no total?",
  opts:["R$ 2 280,00","R$ 2 540,00","R$ 2 630,00","R$ 2 720,00"],

 {stem:"Uma lanchonete usa 12,6 kg de carne por dia, divididos igualmente em três potes. Quantos quilogramas ficam em cada pote?",
  opts:["2,4 kg","2,7 kg","4,2 kg","4,6 kg"],
  a:2, e:"12,6 ÷ 3 = 4,2 kg em cada pote."},
 {stem:"Uma padaria usa 24,6 kg de farinha em três dias, na mesma quantidade por dia. Quantos quilogramas ela gasta por dia?",
  opts:["4,6 kg","6,2 kg","7,3 kg","8,2 kg"],

  opts:["0,245 m","2,45 m","24,5 m","245,0 m"],

]},

{name:"Frações", color:"#7c3aed", questions:[

  opts:["Um três","Um terço","Três terços","Um três avos"],
  a:1, e:"{1/3} lê-se “um terço”. O denominador 3 indica “terços”."},
 {stem:"Uma família consumiu {5/9} de um bolo. Como se lê essa fração?",
  opts:["Cinco nove","Cinco nonos","Nove quintos","Cinco nove avos"],
  a:1, e:"{5/9} lê-se “cinco nonos” (denominador 9 = nonos)."},
 {stem:"Quatro amigos comeram partes de uma torta dividida em 8 pedaços iguais. Veja a fração que cada um comeu. Quem comeu a maior quantidade?",
  media:tbl(["Amigo","Fração que comeu"],[["Alice","{1/4}"],["Beatriz","{1/8}"],["Cauã","{1/2}"],["Davi","{1/8}"]]),
  opts:["Alice","Beatriz","Cauã","Davi"],
  a:2, e:"{1/2} = {4/8} é a maior; {1/4} = {2/8}, e {1/8} é a menor. Cauã comeu mais."},
 {stem:"Quatro crianças comeram partes de barras iguais divididas em 8 pedaços. Veja a fração de cada uma. Quem comeu a maior fração?",
  media:tbl(["Criança","Fração"],[["Carlos","{1/8}"],["Pedro","{5/8}"],["Marcos","{2/8}"],["André","{4/8}"]]),
  opts:["Carlos","Pedro","Marcos","André"],
  a:1, e:"Com o mesmo denominador, maior numerador = maior fração: {5/8} (Pedro)."},
 {stem:"Suzana pediu uma pizza dividida em 8 pedaços iguais. Que fração da pizza representa cada pedaço?",
  opts:["{8/8}","{7/8}","{4/8}","{1/8}"],
  a:3, e:"1 pedaço de 8 partes iguais = {1/8}."},
 {stem:"À medida que pontua, Lívia pinta partes iguais de um círculo. Observe quantas partes já foram pintadas. Que fração representa os pontos que ela já fez?",
  media:pie(8,6),
  opts:["{1/8}","{2/8}","{4/8}","{6/8}"],
  a:3, e:"São 6 partes pintadas de um total de 8 → {6/8}."},

/* ---------- app ---------- */
const LT=['A','B','C','D'];
let current=0, answered=0, hits=0, total=0;
const perTab=TABS.map(t=>({done:0,hit:0,n:t.questions.length}));
TABS.forEach(t=>total+=t.questions.length);
document.getElementById('total').textContent=total;

/* embaralha as alternativas por questão (posição da resposta varia a cada sessão) */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function initOrder(){TABS.forEach(t=>t.questions.forEach(q=>{q._order=shuffle([0,1,2,3]);q._done=false;q._chosen=-1;}));}
initOrder();

const tabsEl=document.getElementById('tabs');
const quizEl=document.getElementById('quiz');
const sumEl=document.getElementById('summary');

function buildTabs(){
  tabsEl.innerHTML='';
  TABS.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===current?' active':'');
    b.style.setProperty('--tabc',t.color);
    b.innerHTML=`<span class="dot"></span>${t.name}`;
    b.onclick=()=>{current=i; render();};
    tabsEl.appendChild(b);
  });
}

function render(){
  buildTabs();
  const tab=TABS[current], col=tab.color;
  document.documentElement.style.setProperty('--accent',col);
  sumEl.className='summary'; sumEl.innerHTML='';
  quizEl.innerHTML='';
  tab.questions.forEach((q,qi)=>{
    const card=document.createElement('div');
    card.className='card'; card.style.borderLeftColor=col;
    const optsHtml=q._order.map((origIdx,pos)=>{
      const o=q.opts[origIdx];
      const body = (typeof o==='object' && o.html) ? `<span class="svgopt">${o.html}</span>` : mf(o);
      return `<button class="opt" data-orig="${origIdx}"><span class="lt">${LT[pos]}</span><span>${body}</span></button>`;
    }).join('');
    card.innerHTML=`
      <div class="qhead">
        <span class="qnum" style="background:${col}">${qi+1}</span>
        <span class="skill">Currículo SAS</span>
      </div>
      <div class="stem">${mf(q.stem)}</div>
      ${q.media?`<div class="media">${q.media}</div>`:''}
      <div class="opts">${optsHtml}</div>
      <div class="explain"></div>`;
    const optBtns=card.querySelectorAll('.opt');
    const exp=card.querySelector('.explain');
    function reveal(chosenOrig,count){
      const right=chosenOrig===q.a;
      optBtns.forEach(b=>{
        b.disabled=true;
        const oi=+b.dataset.orig;
        if(oi===q.a) b.classList.add('correct');
        else if(oi===chosenOrig) b.classList.add('wrong');
      });
      exp.classList.add('show', right?'r':'w');
      exp.innerHTML=`<b>${right?'✓ Correto!':'✗ Não foi dessa vez.'}</b> ${mf(q.e)}`;
      if(count){
        answered++; if(right) hits++;
        perTab[current].done++; if(right) perTab[current].hit++;
        updateStats();
        if(perTab[current].done===perTab[current].n) showSummary();
      }
    }
    if(q._done) reveal(q._chosen,false);
    optBtns.forEach(btn=>{
      btn.onclick=()=>{
        if(q._done) return;
        q._done=true; q._chosen=+btn.dataset.orig;
        reveal(q._chosen,true);
      };
    });
    quizEl.appendChild(card);
  });
  if(perTab[current].n>0 && perTab[current].done===perTab[current].n) showSummary();
}

function showSummary(){
  const p=perTab[current], t=TABS[current];
  sumEl.style.background='linear-gradient(135deg,#f8fafc,#eff6ff)';
  sumEl.style.borderColor=t.color+'55';
  sumEl.className='summary show';
  const pct=Math.round(p.hit/p.n*100);
  let msg = pct===100?'Perfeito! Gabaritou esta parte. 🎉' : pct>=70?'Muito bem! Continue treinando.' : 'Bom começo — revise as questões e tente de novo.';
  sumEl.innerHTML=`<h3 style="color:${t.color}">${t.name} — concluída!</h3>
     <div class="big" style="color:${t.color}">${p.hit}/${p.n}</div>
     <p>${msg}</p>`;
  sumEl.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function updateStats(){
  document.getElementById('ans').textContent=answered;
  document.getElementById('hits').textContent=hits;
  document.getElementById('fill').style.width=(answered/total*100)+'%';
}

document.getElementById('restart').onclick=()=>{
  answered=0; hits=0; current=0;
  perTab.forEach(p=>{p.done=0;p.hit=0;});
  initOrder();
  updateStats(); render();
  window.scrollTo({top:0,behavior:'smooth'});
};

render();
</script>
