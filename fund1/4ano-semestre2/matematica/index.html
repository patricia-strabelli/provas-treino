<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2ª Prova Treino · 4º ano — Matemática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mt:#2b7a9e; --mt-soft:#e6f1f6;
    --ink:#1f2733; --muted:#5c6672; --line:#e7e9ee; --bg:#f5f6f8; --card:#ffffff;
    --ok:#2e7d32; --ok-bg:#e7f4e9; --ok-line:#bfe0c5;
    --no:#c62828; --no-bg:#fdecea; --no-line:#f4c7c2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,Arial,sans-serif;line-height:1.55}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{text-align:center;padding:22px 8px 8px}
  .kicker{display:inline-block;font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mt);background:var(--mt-soft);padding:4px 10px;border-radius:999px;margin-bottom:12px}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(26px,6vw,40px);margin:0;line-height:1.05;letter-spacing:-.01em}
  .sub{color:var(--muted);margin-top:8px;font-size:15px}
  .tabs{display:flex;justify-content:center;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
  .tab{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;border:2px solid var(--mt);color:#fff;background:var(--mt)}
  .scorebar{display:flex;gap:10px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;color:var(--muted);min-width:120px;text-align:center}
  .chip b{display:block;font-family:"Space Mono",monospace;font-size:20px;color:var(--ink)}
  .progress{height:8px;background:#e9ebf0;border-radius:999px;overflow:hidden;margin:14px 2px 22px}
  .progress > i{display:block;height:100%;width:0;background:var(--mt);transition:width .25s ease}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .qhead{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
  .qnum{font-family:"Space Mono",monospace;font-weight:700;font-size:22px;color:var(--mt);background:var(--mt-soft);border-radius:10px;padding:2px 12px;flex:none}
  .skill{margin-left:auto;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);padding:3px 8px;border-radius:8px;flex:none}
  .contexto{background:#fafbfc;border:1px solid var(--line);border-left:4px solid var(--mt);border-radius:10px;padding:14px 16px;margin:6px 0 16px;font-size:15.5px;color:#26303c}
  .calc{font-family:"Space Mono",monospace;font-size:13.5px;line-height:1.6;display:inline-block}
  table.tbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:14.5px}
  table.tbl th,table.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left}
  table.tbl th{background:var(--mt-soft);color:#1d5468;font-family:"Bricolage Grotesque",sans-serif}
  table.tbl tr:nth-child(even) td{background:#fafbfc}
  .stem{font-size:17px;font-weight:600;margin:4px 0 14px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;cursor:pointer;transition:border-color .15s,background .15s;font-family:inherit;color:var(--ink);width:100%}
  .opt:hover:not(:disabled){border-color:var(--mt)}
  .opt .letter{font-family:"Space Mono",monospace;font-weight:700;color:var(--muted);flex:none;width:24px;height:24px;border-radius:7px;background:#f0f1f4;display:grid;place-items:center;font-size:14px}
  .opt.sel{border-color:var(--mt);background:var(--mt-soft)}
  .opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}
  .opt.correct .letter{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no-line);background:var(--no-bg)}
  .opt.wrong .letter{background:var(--no);color:#fff}
  .opt:disabled{cursor:default}
  .opt svg{display:block}
  .fb{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:15px;display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--ok-bg);border:1px solid var(--ok-line)}
  .fb.no{background:var(--no-bg);border:1px solid var(--no-line)}
  .fb .verdict{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;margin-bottom:4px}
  .fb.ok .verdict{color:var(--ok)} .fb.no .verdict{color:var(--no)}
  .actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
  button.btn{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;border:none;border-radius:12px;padding:12px 22px;cursor:pointer}
  .btn.primary{background:var(--mt);color:#fff} .btn.primary:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:#eef0f3;color:var(--ink)}
  .resumo{text-align:center;padding:28px 20px}
  .resumo h2{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;margin:0 0 6px}
  .bigscore{font-family:"Space Mono",monospace;font-size:52px;font-weight:700;color:var(--mt);margin:10px 0}
  .resumo p{color:var(--muted);margin:4px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="kicker">2ª Prova Treino · 4º ano</span>
    <h1>Matemática</h1>
    <div class="sub">Modo prática · versão combinada · correção na hora, sem nota</div>
    <div class="tabs"><span class="tab">Matemática</span></div>
  </header>
  <div class="scorebar">
    <div class="chip">Respondidas <b id="answered">0</b></div>
    <div class="chip">Acertos <b id="hits">0</b></div>
    <div class="chip">Questão <b id="counter">1/48</b></div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div id="quiz"></div>
</div>
<script>
const QUESTIONS = [{"q":"Carlos comprou 4 pacotes de balões para a sua festa. Cada pacote tem 25 balões. Para saber o total, ele multiplicou 4 × 25 usando a decomposição de 25. Qual registro mostra esse cálculo corretamente?","o":["<span class=\"calc\">4 × (20 + 5) =<br>(4 × 20) + (4 × 5) =<br>80 + 20 = 100</span>","<span class=\"calc\">4 × (20 + 5) =<br>(4 × 20) + 5 =<br>80 + 5 = 85</span>","<span class=\"calc\">5 × (20 + 4) =<br>(5 × 20) + (5 × 4) =<br>100 + 20 = 120</span>","<span class=\"calc\">4 × (2 + 5) =<br>(4 × 2) + (4 × 5) =<br>8 + 20 = 28</span>"],"a":0,"e":"Decompondo 25 em 20 + 5 e aplicando a distributiva: (4×20)+(4×5) = 80+20 = 100. Logo, 4 × 25 = 100 balões.","s":"Currículo SAS · Multiplicação por decomposição"},{"q":"Helena montou 34 kits com 3 itens cada. Para facilitar, ela decompôs o 34 antes de multiplicar. Qual registro mostra o cálculo correto de 34 × 3?","o":["<span class=\"calc\">(30 + 4) × 3 =<br>(30 × 3) + 4 =<br>90 + 4 = 94</span>","<span class=\"calc\">(30 + 4) × 3 =<br>(30 × 3) + (4 × 3) =<br>90 + 12 = 102</span>","<span class=\"calc\">(30 + 4) × 3 =<br>30 × 4 × 3 =<br>360</span>","<span class=\"calc\">(30 + 4) × 3 =<br>30 + (4 × 3) =<br>30 + 12 = 42</span>"],"a":1,"e":"Decompondo 34 em 30 + 4 e usando a distributiva: (30×3)+(4×3) = 90+12 = 102. Logo, 34 × 3 = 102 itens.","s":"Currículo SAS · Multiplicação por decomposição"},{"q":"João está organizando os livros da sua biblioteca em 7 prateleiras. Cada prateleira guardará 48 livros. No total, quantos livros há na biblioteca de João?","o":["96","328","336","84"],"a":2,"e":"7 × 48 = 336. São 336 livros no total.","s":"Currículo SAS · Multiplicação"},{"q":"André recebeu 28 caixas de detergente para o seu mercado. Cada caixa continha 36 garrafas. Quantas garrafas André recebeu ao todo?","o":["1108","64","360","1008"],"a":3,"e":"28 × 36 = 1008. André recebeu 1008 garrafas.","s":"Currículo SAS · Multiplicação"},{"q":"Mariana faz e vende pudins. Toda semana ela compra 15 latas de leite condensado a 8 reais cada. Quanto ela gasta por semana com esse ingrediente?","o":["120 reais","100 reais","105 reais","112 reais"],"a":0,"e":"15 × 8 = 120. Ela gasta 120 reais por semana.","s":"Currículo SAS · Multiplicação com dinheiro"},{"q":"Murilo comprou 54 cremes dentais iguais para doar, cada um custando R$ 12,00. Quanto Murilo gastou ao todo?","o":["R$ 758,00","R$ 648,00","R$ 698,00","R$ 728,00"],"a":1,"e":"54 × 12 = 648. Murilo gastou R$ 648,00.","s":"Currículo SAS · Multiplicação com dinheiro"},{"t":"Quatro alunos calcularam <b>14 × 9</b> de jeitos diferentes:<br><span class=\"calc\">Ana: (10+4)×9 = (10×9)+(4×9) = 90+36 = 126</span><br><span class=\"calc\">Bia: 14×10=140; 14×1=14; 140+14 = 154</span><br><span class=\"calc\">Caio: 14×9 → 63 + 90 = 153</span><br><span class=\"calc\">Davi: 10×9=90; 4×9=36; 90−36 = 54</span>","q":"Quem encontrou o resultado correto?","o":["Caio","Davi","Ana","Bia"],"a":2,"e":"14 × 9 = 126. Só a Ana chegou a 126; os demais erraram alguma etapa.","s":"Currículo SAS · Estratégias de multiplicação"},{"t":"Quatro alunos calcularam <b>12 × 45</b> pelo algoritmo. Os resultados foram:<br><span class=\"calc\">Miguel → 60 + 48 = 108</span><br><span class=\"calc\">Nara → 60 + 480 = 540</span><br><span class=\"calc\">Paula → 48 + 600 = 648</span><br><span class=\"calc\">Otávio → 600 − 48 = 552</span>","q":"Qual aluno efetuou a multiplicação corretamente?","o":["Paula","Otávio","Miguel","Nara"],"a":3,"e":"12 × 45 = 540. A Nara somou corretamente 60 + 480 = 540.","s":"Currículo SAS · Estratégias de multiplicação"},{"q":"Marcos repartiu 24 bolinhas igualmente entre seus 3 irmãos, e cada um recebeu 8, pois 24 ÷ 3 = 8. Qual operação inversa ele pode fazer para conferir esse resultado?","o":["8 × 3","8 − 3","8 ÷ 3","8 + 3"],"a":0,"e":"A divisão se confere com a multiplicação: 8 × 3 = 24, o valor inicial. Está correto.","s":"Currículo SAS · Operação inversa"},{"q":"Seis crianças usaram 34 parafusos cada para montar robôs, num total de 34 × 6 = 204. Qual operação inversa deve ser feita para conferir esse resultado?","o":["204 × 6","204 ÷ 6","204 + 6","204 − 6"],"a":1,"e":"A multiplicação se confere com a divisão: 204 ÷ 6 = 34, o valor por criança. Está correto.","s":"Currículo SAS · Operação inversa"},{"q":"Um caderno de 5 matérias tem 185 folhas no total, e cada matéria tem a mesma quantidade de folhas. Quantas folhas tem cada matéria?","o":["33","35","37","31"],"a":2,"e":"185 ÷ 5 = 37 folhas em cada matéria.","s":"Currículo SAS · Divisão exata"},{"q":"A mãe de Miguel comprou um liquidificador por R$ 216,00 e vai pagar em 3 parcelas iguais. Qual é o valor de cada parcela?","o":["R$ 36,00","R$ 54,00","R$ 62,00","R$ 72,00"],"a":3,"e":"216 ÷ 3 = 72. Cada parcela é de R$ 72,00.","s":"Currículo SAS · Divisão exata"},{"q":"Lucas tinha 180 figurinhas. Deu 40 ao Thiago e dividiu o restante igualmente entre Felipe e Mateus. Qual expressão calcula quantas figurinhas o Mateus recebeu?","o":["(180 − 40) ÷ 2","40 × 2 + 180","(180 + 40) ÷ 2","(180 ÷ 3)"],"a":0,"e":"Primeiro tira as 40 do Thiago: 180 − 40 = 140. Depois divide entre os dois amigos: 140 ÷ 2. Logo, (180 − 40) ÷ 2.","s":"Currículo SAS · Operações combinadas"},{"q":"Giovana comprou 39 bombons. Deu 15 ao irmão e dividiu o que sobrou igualmente entre as suas 2 primas. Qual expressão resulta em quantos bombons cada prima recebeu?","o":["39 − 15","(39 − 15) ÷ 2","(39 − 15) ÷ 3","39 ÷ 3"],"a":1,"e":"Primeiro tira os 15 do irmão: 39 − 15 = 24. Depois divide entre as 2 primas: 24 ÷ 2. Logo, (39 − 15) ÷ 2.","s":"Currículo SAS · Operações combinadas"},{"q":"Sara tem 1 545 reais e Beatriz tem a terça parte dessa quantia. Quanto as duas têm juntas para comprar um pacote de viagem?","o":["1 010 reais","1 515 reais","2 060 reais","4 545 reais"],"a":2,"e":"Terça parte de 1 545 = 1 545 ÷ 3 = 515. Juntas: 1 545 + 515 = 2 060 reais.","s":"Currículo SAS · Fração de quantidade"},{"q":"Marcos cortou uma torta em 42 pedaços iguais e distribuiu a terça parte deles entre alguns amigos. Quantos pedaços Marcos distribuiu?","o":["15","16","13","14"],"a":3,"e":"Terça parte de 42 = 42 ÷ 3 = 14 pedaços.","s":"Currículo SAS · Fração de quantidade"},{"q":"A gestação de uma vaca dura aproximadamente 9 meses, e cada mês tem, em média, 30 dias. Quantos dias dura, aproximadamente, essa gestação?","o":["270 dias","240 dias","330 dias","300 dias"],"a":0,"e":"9 × 30 = 270 dias.","s":"Currículo SAS · Conversão de tempo"},{"q":"A arara-azul-grande vive, em média, 50 anos. Quantos meses correspondem a esse tempo de vida?","o":["550","600","650","500"],"a":1,"e":"Cada ano tem 12 meses: 50 × 12 = 600 meses.","s":"Currículo SAS · Conversão de tempo"},{"q":"Pedro saiu de casa às 7h para ir à escola. Ao voltar, o relógio marcava 14h15min. Quanto tempo Pedro passou fora de casa?","o":["21 horas e 15 minutos","7 horas","7 horas e 15 minutos","21 horas"],"a":2,"e":"De 7h às 14h são 7 horas; até 14h15 são mais 15 minutos. Total: 7 horas e 15 minutos.","s":"Currículo SAS · Duração de tempo"},{"q":"Arthur começou uma corrida às 7h30min e cruzou a linha de chegada às 8h56min. Quanto tempo ele levou para concluir a corrida?","o":["2 horas e 36 minutos","2 horas e 26 minutos","1 hora e 36 minutos","1 hora e 26 minutos"],"a":3,"e":"De 7h30 às 8h30 é 1 hora; de 8h30 às 8h56 são 26 minutos. Total: 1 hora e 26 minutos.","s":"Currículo SAS · Duração de tempo"},{"q":"Juliana vai usar um tecido de 2 metros e 30 centímetros de comprimento. Qual é esse comprimento expresso em centímetros?","o":["230 cm","0,23 cm","2,3 cm","23 cm"],"a":0,"e":"1 metro = 100 cm, então 2 m = 200 cm. Com os 30 cm: 200 + 30 = 230 cm.","s":"Currículo SAS · Conversão de medidas"},{"q":"No petshop, Larissa informou que seu cachorro tem 6 quilogramas e 210 gramas. A atendente registrou essa massa em gramas. Qual número ela escreveu?","o":["6,210","6 210","621,0","62,10"],"a":1,"e":"1 kg = 1 000 g, então 6 kg = 6 000 g. Com os 210 g: 6 000 + 210 = 6 210 g.","s":"Currículo SAS · Conversão de medidas"},{"q":"Carol colocou um pedaço de queijo na balança e o visor mostrou o número 300, mas, por defeito, não indicou a unidade. Qual é a unidade de medida mais adequada para essa situação?","o":["Miligrama (mg)","Tonelada (t)","Grama (g)","Quilograma (kg)"],"a":2,"e":"Um pedaço de queijo pesando 300 tem sentido em gramas (300 g). Em kg seria pesadíssimo e em mg, leve demais.","s":"Currículo SAS · Unidade de medida adequada"},{"q":"Eduardo mediu o comprimento do seu pé e registrou “21”, mas esqueceu a unidade. Qual é a unidade de medida mais adequada para essa medição?","o":["Metro","Quilômetro","Milímetro","Centímetro"],"a":3,"e":"Um pé com 21 faz sentido em centímetros (21 cm). Em metros seria enorme e em milímetros, pequeno demais.","s":"Currículo SAS · Unidade de medida adequada"},{"q":"Rafael preparou 1,6 L de suco e vai servi-lo em copos de 200 mL cada. Quantos copos ele conseguirá encher completamente?","o":["8","7","5","4"],"a":0,"e":"1,6 L = 1 600 mL. 1 600 ÷ 200 = 8 copos.","s":"Currículo SAS · Capacidade"},{"q":"Amanda quer beber 1,5 L de água por dia usando uma garrafa de 250 mL, que ela enche por completo a cada vez. Quantas vezes precisa encher a garrafa para atingir a meta?","o":["3","6","5","4"],"a":1,"e":"1,5 L = 1 500 mL. 1 500 ÷ 250 = 6 vezes.","s":"Currículo SAS · Capacidade"},{"q":"Em um dia, a temperatura mínima prevista para a Região Centro-Oeste era de 9 °C e a máxima, de 38 °C. Qual é a variação de temperatura prevista?","o":["39 °C","47 °C","29 °C","38 °C"],"a":2,"e":"A variação é a diferença entre máxima e mínima: 38 − 9 = 29 °C.","s":"Currículo SAS · Temperatura"},{"t":"Temperaturas registradas em quatro cidades numa manhã:<table class=\"tbl\"><thead><tr><th>Cidade</th><th>Temperatura</th></tr></thead><tbody><tr><td>Curitiba-PR</td><td>12 °C</td></tr><tr><td>Salvador-BA</td><td>27 °C</td></tr><tr><td>São Paulo-SP</td><td>18 °C</td></tr><tr><td>Manaus-AM</td><td>30 °C</td></tr></tbody></table>","q":"Em qual cidade foi registrada a temperatura mais alta?","o": circle cx=\"262.0\" cy=\"30\" r=\"4.5\" fill=\"var(--mt)\"/><text x=\"262.0\" y=\"21\" font-size=\"9\" font-family=\"Public Sans, sans-serif\" text-anchor=\"middle\" fill=\"#1f2733\">Gato</text></svg></div>","q":"Qual é a massa do coelho e do gato, nessa ordem?","o":["2,0 kg e 3,0 kg","1,0 kg e 2,5 kg","1,5 kg e 2,5 kg","1,5 kg e 3,0 kg"],"a":3,"e":"O coelho está sobre o 1,5 e o gato sobre o 3,0. Logo, 1,5 kg e 3,0 kg.","s":"Currículo SAS · Reta numérica"},{"q":"Camila precisa fazer um cartaz para um produto que custará doze reais e noventa centavos. Qual preço está escrito corretamente?","o":["R$ 12,90","R$ 9,12","R$ 90,12","R$ 12,09"],"a":0,"e":"Doze reais e noventa centavos escreve-se R$ 12,90 (12 reais e 90 centavos).","s":"Currículo SAS · Sistema monetário"},{"q":"O preço de um produto é R$ 12,40. Qual é a escrita por extenso desse valor?","o":["Doze reais e quatro centavos","Doze reais e quarenta centavos","Doze e quarenta","Doze e quarenta reais"],"a":1,"e":"R$ 12,40 são 12 reais e 40 centavos: doze reais e quarenta centavos.","s":"Currículo SAS · Sistema monetário"},{"q":"O chocolate de Lara custa R$ 2,10, e ela tinha exatamente 5 moedas que somavam esse valor. Qual conjunto de moedas totaliza R$ 2,10?","o":["1 moeda de 10 centavos e 4 de 5 centavos","4 moedas de 10 centavos e 1 de 1 real","4 moedas de 50 centavos e 1 de 10 centavos","4 moedas de 25 centavos e 1 de 1 real"],"a":2,"e":"4 × 0,50 = 2,00; com mais 0,10, dá 2,10 — usando exatamente 5 moedas.","s":"Currículo SAS · Sistema monetário"},{"q":"Bruna recebeu de troco: 3 moedas de 1 real, 2 de 50 centavos, 1 de 25 centavos, 2 de 10 centavos e 1 de 5 centavos. Qual foi o valor total do troco?","o":["R$ 4,75","R$ 5,00","R$ 5,25","R$ 4,50"],"a":3,"e":"3,00 + 1,00 + 0,25 + 0,20 + 0,05 = 4,50. O troco foi R$ 4,50.","s":"Currículo SAS · Sistema monetário"},{"q":"André comprou um pão recheado por R$ 18,30 e um chocolate quente por R$ 5,95. Quanto ele gastou com comida?","o":["R$ 24,25","R$ 12,35","R$ 13,65","R$ 23,25"],"a":0,"e":"18,30 + 5,95 = 24,25. André gastou R$ 24,25.","s":"Currículo SAS · Adição com dinheiro"},{"q":"Enzo pediu um suco de R$ 6,40 e um pão de queijo de R$ 4,80 e pagou com uma nota de R$ 20,00. Quanto recebeu de troco?","o":["R$ 13,60","R$ 8,80","R$ 9,20","R$ 11,20"],"a":1,"e":"A conta: 6,40 + 4,80 = 11,20. O troco: 20,00 − 11,20 = 8,80.","s":"Currículo SAS · Troco"},{"q":"Juliano foi à papelaria com R$ 5,00 e comprou uma caneta por R$ 1,30 e duas borrachas de R$ 0,75 cada. Quanto recebeu de troco?","o":["R$ 2,95","R$ 2,05","R$ 2,20","R$ 2,80"],"a":2,"e":"Gastou 1,30 + 2 × 0,75 = 1,30 + 1,50 = 2,80. Troco: 5,00 − 2,80 = 2,20.","s":"Currículo SAS · Troco"},{"q":"Pedro comprou um chocolate quente por R$ 5,50, duas empadas de R$ 2,50 cada e um suco por R$ 6,00, e ganhou R$ 2,00 de desconto no total. Quanto ele pagou?","o":["R$ 15,50","R$ 16,50","R$ 13,50","R$ 14,50"],"a":3,"e":"5,50 + 2 × 2,50 + 6,00 = 5,50 + 5,00 + 6,00 = 16,50. Com o desconto: 16,50 − 2,00 = 14,50.","s":"Currículo SAS · Operações com dinheiro"}];

let idx = 0, answered = 0, hits = 0;
const answeredMap = {};
const orders = {};
function shuffleOrders(){
  QUESTIONS.forEach((q,qi)=>{const a=[0,1,2,3];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}orders[qi]=a;});
}
shuffleOrders();

const quiz=document.getElementById('quiz'),elAnswered=document.getElementById('answered'),elHits=document.getElementById('hits'),elCounter=document.getElementById('counter'),elBar=document.getElementById('bar');
const LETTERS=['A','B','C','D'];

function render(){
  const q=QUESTIONS[idx], done=answeredMap[idx]!==undefined, chosen=done?answeredMap[idx]:null;
  let opts='';
  const order=orders[idx]||[0,1,2,3];
  order.forEach((orig,pos)=>{
    let cls='opt';
    if(done){ if(orig===q.a) cls+=' correct'; else if(orig===chosen) cls+=' wrong'; }
    opts+=`<button class="${cls}" data-i="${orig}" ${done?'disabled':''}><span class="letter">${LETTERS[pos]}</span><span>${q.o[orig]}</span></button>`;
  });
  let fb='';
  if(done){const ok=chosen===q.a;fb=`<div class="fb ${ok?'ok':'no'} show"><div class="verdict">${ok?'Isso mesmo!':'Ainda não é essa.'}</div><div>${q.e}</div></div>`;}
  const last=idx===QUESTIONS.length-1;
  quiz.innerHTML=`<div class="card"><div class="qhead"><span class="qnum">${idx+1}</span><span class="skill">${q.s}</span></div>${q.t?'<div class="contexto">'+q.t+'</div>':''}<div class="stem">${q.q}</div><div class="opts">${opts}</div>${fb}<div class="actions"><button class="btn ghost" id="prev" ${idx===0?'disabled':''}>Anterior</button><button class="btn primary" id="next" ${done?'':'disabled'}>${last?'Ver resumo':'Próxima'}</button></div></div>`;
  quiz.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>choose(parseInt(b.dataset.i,10))));
  const prev=document.getElementById('prev'); if(prev) prev.addEventListener('click',()=>{if(idx>0){idx--;render();}});
  document.getElementById('next').addEventListener('click',()=>{ if(last){showResumo();}else{idx++;render();} });
  elCounter.textContent=(idx+1)+'/'+QUESTIONS.length; updateBar();
}
function choose(i){ if(answeredMap[idx]!==undefined)return; answeredMap[idx]=i; answered++; if(i===QUESTIONS[idx].a)hits++; elAnswered.textContent=answered; elHits.textContent=hits; render(); }
function updateBar(){ elBar.style.width=(answered/QUESTIONS.length*100)+'%'; }
function showResumo(){
  const total=QUESTIONS.length, pct=Math.round(hits/total*100);
  let msg; if(pct>=80)msg='Excelente! Você domina bem as habilidades desta prova.'; else if(pct>=60)msg='Bom trabalho! Revise os pontos que errou e siga em frente.'; else if(pct>=40)msg='Você está no caminho. Refaça com calma os cálculos que errou.'; else msg='Sem problema — a prática é para isso. Tente de novo com atenção.';
  quiz.innerHTML=`<div class="card resumo"><span class="kicker">Resumo</span><h2>Prova concluída!</h2><div class="bigscore">${hits}/${total}</div><p>Você acertou <b>${pct}%</b> das questões.</p><p>Respondidas: ${answered} de ${total}</p><p style="margin-top:14px">${msg}</p><div class="actions" style="justify-content:center;margin-top:22px"><button class="btn primary" id="restart">Recomeçar</button></div></div>`;
  document.getElementById('restart').addEventListener('click',restart); elBar.style.width='100%';
}
function restart(){ idx=0;answered=0;hits=0; for(const k in answeredMap)delete answeredMap[k]; shuffleOrders(); elAnswered.textContent='0'; elHits.textContent='0'; render(); }
render();
</script>
